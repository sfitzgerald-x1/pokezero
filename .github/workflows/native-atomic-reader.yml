name: Native atomic reader contracts
on:
  pull_request:
    paths:
      - src/pokezero/mcts_eval/search_over_raw_native_atomic_work.py
      - tests/test_search_over_raw_native_atomic_work.py
      - .github/workflows/native-atomic-reader.yml
  push:
    branches: [main]
    paths:
      - src/pokezero/mcts_eval/search_over_raw_native_atomic_work.py
      - tests/test_search_over_raw_native_atomic_work.py
      - .github/workflows/native-atomic-reader.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run standalone float32 and deadline contracts
        env:
          PYTHONPATH: src:tests
        run: python -B -S -m unittest test_search_over_raw_native_atomic_work -v
