name: Search actor projection contracts
on:
  pull_request:
    paths:
      - src/pokezero/mcts_eval/search_over_raw_actor_projection.py
      - tests/test_search_over_raw_actor_projection.py
      - .github/workflows/search-actor-projection.yml
      - src/pokezero/local_showdown.py
      - src/pokezero/showdown.py
      - src/pokezero/belief.py
      - src/pokezero/tier2.py
      - src/pokezero/investment.py
      - src/pokezero/observation.py
      - src/pokezero/dex.py
      - src/pokezero/randbat.py
      - src/pokezero/randbat_vocab.py
      - tests/test_local_showdown.py
      - tests/test_showdown.py
  push:
    branches: [main]
    paths:
      - src/pokezero/mcts_eval/search_over_raw_actor_projection.py
      - tests/test_search_over_raw_actor_projection.py
      - .github/workflows/search-actor-projection.yml
      - src/pokezero/local_showdown.py
      - src/pokezero/showdown.py
      - src/pokezero/belief.py
      - src/pokezero/tier2.py
      - src/pokezero/investment.py
      - src/pokezero/observation.py
      - src/pokezero/dex.py
      - src/pokezero/randbat.py
      - src/pokezero/randbat_vocab.py
      - tests/test_local_showdown.py
      - tests/test_showdown.py
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Checkout pinned Pokemon Showdown catalog
        uses: actions/checkout@v5
        with:
          repository: smogon/pokemon-showdown
          ref: f76228a1354b5d0f307ca2d16101294ad3a2308b
          path: .ci/pokemon-showdown
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: .ci/pokemon-showdown/package-lock.json
      - name: Build static catalog
        run: |
          npm ci --prefix .ci/pokemon-showdown
          npm run build --prefix .ci/pokemon-showdown
          test -f .ci/pokemon-showdown/dist/sim/dex.js
      - name: Run process-free actor projection contracts
        env:
          POKEZERO_SHOWDOWN_ROOT: ${{ github.workspace }}/.ci/pokemon-showdown
          PYTHONPATH: src:tests
        run: python -B -S -m unittest test_search_over_raw_actor_projection -v
