name: Neural smoke

on:
  pull_request:
    paths:
      - ".github/workflows/neural-smoke.yml"
      - "pyproject.toml"
      - "src/pokezero/__init__.py"
      - "src/pokezero/collection.py"
      - "src/pokezero/neural_cli.py"
      - "src/pokezero/neural_policy.py"
      - "tests/test_neural_policy.py"

# Superseded PR heads do not need a second dependency install and smoke run.
concurrency:
  group: neural-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  neural-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Cache package downloads only. The checkout and all native artifacts
          # are still built from this PR's source on every run.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install neural extra
        run: python -m pip install -e '.[neural]'

      - name: Run neural policy tests
        run: python -m unittest tests.test_neural_policy
