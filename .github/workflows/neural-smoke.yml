name: Neural smoke

on:
  pull_request:
    paths:
      - ".github/workflows/neural-smoke.yml"
      - "pyproject.toml"
      - "src/pokezero/__init__.py"
      - "src/pokezero/collection.py"
      - "src/pokezero/neural_cli.py"
      - "src/pokezero/neural_policy.py"
      - "src/pokezero/neural_selfplay.py"
      - "src/pokezero/selfplay.py"
      - "src/pokezero/rollout_cli.py"
      - "src/pokezero/search_label*.py"
      - "src/pokezero/value_precision_probe.py"
      - "scripts/freeze_value_probe_cohort.py"
      - "scripts/extract_value_probe_features.py"
      - "scripts/fit_value_probe_heads.py"
      - "tests/test_neural_policy.py"
      - "tests/test_search_label*.py"
      - "tests/test_value_precision_probe.py"
      - "tests/test_value_probe_*.py"

# Superseded PR heads do not need a second dependency install and smoke run.
concurrency:
  group: neural-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  neural-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          # Cache package downloads only. The checkout and all native artifacts
          # are still built from this PR's source on every run.
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install neural extra
        run: python -m pip install -e '.[neural]'

      - name: Run neural policy tests
        run: >-
          python -m unittest tests.test_neural_policy
          tests.test_search_labels tests.test_search_label_dataset
          tests.test_search_label_loss tests.test_search_label_collection
          tests.test_value_precision_probe tests.test_value_probe_feature_extraction
          tests.test_value_probe_head_fitting
