name: Search screening kernel contracts
on:
  pull_request:
    paths:
      - src/pokezero/mcts_eval/search_over_raw_screening.py
      - tests/test_search_over_raw_screening.py
      - src/pokezero/mcts_eval/search_over_raw_deviations.py
      - tests/test_search_over_raw_deviations.py
      - scripts/calibrate_search_over_raw_sparse.py
      - tests/test_search_over_raw_sparse_sensitivity.py
      - src/pokezero/mcts_eval/search_over_raw_margin.py
      - tests/test_search_over_raw_margin.py
      - src/pokezero/mcts_eval/search_over_raw_budget16384.py
      - tests/test_search_over_raw_budget16384.py
      - src/pokezero/mcts_eval/fullgame_strength.py
      - tests/test_fullgame_strength.py
      - scripts/run_fullgame_panel.py
      - tests/test_fullgame_panel.py
      - src/pokezero/foulplay_bridge.py
      - src/pokezero/fullgame_phase_progress.py
      - tests/test_fullgame_phase_progress.py
      - scripts/coordinate_fullgame_panels.py
      - tests/test_fullgame_coordinator.py
      - scripts/install_phase0_reference_bundle.py
      - tests/test_reference_bundle_install.py
      - pyproject.toml
      - .github/workflows/search-screening-kernel.yml
  push:
    branches: [main]
    paths:
      - src/pokezero/mcts_eval/search_over_raw_screening.py
      - tests/test_search_over_raw_screening.py
      - src/pokezero/mcts_eval/search_over_raw_deviations.py
      - tests/test_search_over_raw_deviations.py
      - scripts/calibrate_search_over_raw_sparse.py
      - tests/test_search_over_raw_sparse_sensitivity.py
      - src/pokezero/mcts_eval/search_over_raw_margin.py
      - tests/test_search_over_raw_margin.py
      - src/pokezero/mcts_eval/search_over_raw_budget16384.py
      - tests/test_search_over_raw_budget16384.py
      - src/pokezero/mcts_eval/fullgame_strength.py
      - tests/test_fullgame_strength.py
      - scripts/run_fullgame_panel.py
      - tests/test_fullgame_panel.py
      - src/pokezero/foulplay_bridge.py
      - src/pokezero/fullgame_phase_progress.py
      - tests/test_fullgame_phase_progress.py
      - scripts/coordinate_fullgame_panels.py
      - tests/test_fullgame_coordinator.py
      - scripts/install_phase0_reference_bundle.py
      - tests/test_reference_bundle_install.py
      - pyproject.toml
      - .github/workflows/search-screening-kernel.yml
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install numerical contract dependencies
        run: python -m pip install -e '.[analysis]' 'numpy>=1.26,<3'
      - name: Run standalone contracts
        env:
          PYTHONPATH: src:tests
        run: python -m unittest test_search_over_raw_screening test_search_over_raw_deviations test_search_over_raw_sparse_sensitivity test_search_over_raw_margin test_search_over_raw_budget16384 test_fullgame_strength test_fullgame_panel test_fullgame_phase_progress test_fullgame_coordinator test_reference_bundle_install -v
