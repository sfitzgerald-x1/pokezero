name: Secret scanning

on:
  pull_request:
  push:
    branches:
      - main

# The next scan covers all commits reachable from the new head, so an older
# queued scan cannot add coverage.  Keep different branches/PRs independent.
concurrency:
  group: secret-scanning-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
