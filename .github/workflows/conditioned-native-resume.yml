name: Conditional native continuation
on:
  pull_request:
    paths:
      - 'third_party/poke-engine-gen3-*.patch'
      - 'third_party/poke-engine-gen3-patches.txt'
      - 'scripts/apply_poke_engine_patches.py'
      - 'rust/pokezero-search/**'
      - 'gpu_engine/**'
      - 'tests/test_conditioned_native_resume.py'
      - 'tests/test_constructor_provenance.py'
      - 'tests/test_prospective_fidelity_panel.py'
      - 'tests/test_gpu_engine_panel_owner.py'
      - 'tests/test_native_gpu_panel_execution.py'
      - '.github/workflows/conditioned-native-resume.yml'
permissions:
  contents: read
concurrency:
  group: conditioned-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  conditional-successors:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      POKEZERO_ENUMERATE_ROLLS: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
      - name: Build isolated opt-in oracle bindings
        run: |
          python -m pip install 'jax==0.12.0' 'numpy==2.5.4' 'maturin>=1.5,<2'
          scripts/vendor_poke_engine_src.sh "$(command -v python)"
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml --no-default-features --features gen3 --test test_gen3
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml --no-default-features --features conditioned-oracle --lib conditioned_resume
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --lib conditioned_resume::tests
          python -m maturin build --manifest-path third_party/poke-engine-src/poke-engine-py/Cargo.toml --release --no-default-features --features conditioned-oracle --out /tmp/conditioned-wheels
          python -m maturin build --manifest-path rust/pokezero-search/Cargo.toml --release --no-default-features --features conditioned-oracle --out /tmp/conditioned-wheels
          python -m pip install /tmp/conditioned-wheels/*.whl
      - name: Compare complete authored successors without skips
        run: |
          python - <<'PY'
          import unittest, pokezero_search
          assert pokezero_search.CONDITIONED_ORACLE_ENABLED
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'tests.test_conditioned_native_resume', 'tests.test_constructor_provenance',
              'tests.test_prospective_fidelity_panel', 'tests.test_gpu_engine_panel_owner',
              'tests.test_native_gpu_panel_execution'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun >= 47 and not result.skipped
          assert result.wasSuccessful()
          PY
