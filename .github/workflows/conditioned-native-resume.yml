name: Conditional native continuation
on:
  pull_request:
    paths:
      - 'third_party/poke-engine-gen3-*.patch'
      - 'third_party/poke-engine-gen3-patches.txt'
      - 'scripts/apply_poke_engine_patches.py'
      - 'rust/pokezero-search/**'
      - 'gpu_engine/**'
      - 'tests/test_conditioned_native_resume.py'
      - 'tests/test_conditioned_native_faint_replacements.py'
      - 'tests/test_conditioned_native_ordinary.py'
      - 'tests/test_ordinary_carry_panel.py'
      - 'tests/test_gpu_engine_carry_law.py'
      - 'tests/test_conditioned_native_roles.py'
      - 'tests/test_conditioned_native_deterministic_abilities.py'
      - 'tests/test_native_gen3_trace_entry.py'
      - 'tests/test_gpu_engine_trace_entry.py'
      - 'tests/test_constructor_provenance.py'
      - 'tests/test_prospective_fidelity_panel.py'
      - 'tests/test_panel_cost_integration.py'
      - 'tests/test_action_history_native.py'
      - 'tests/test_wish_history_native.py'
      - 'tests/test_rest_origin_native.py'
      - 'tests/test_native_gen3_natural_cure_cleanup.py'
      - 'tests/test_native_gen3_stall_pp.py'
      - 'rust/pokezero-search/tests/gen3_minimum_damage.rs'
      - 'tests/test_native_gen3_choice_band_before_move.py'
      - 'tests/test_native_gpu_secondary_move_effects.py'
      - 'tests/test_native_gpu_synchronize.py'
      - 'tests/test_gpu_engine_synchronize.py'
      - 'tests/data/gpu_synchronize_catalog.json'
      - 'tests/test_gpu_engine_secondary_move_effects.py'
      - 'tests/test_gpu_engine_successor_cache.py'
      - 'tests/test_gpu_engine_panel_owner.py'
      - 'tests/test_native_gpu_panel_execution.py'
      - '.github/workflows/conditioned-native-resume.yml'
permissions:
  contents: read
concurrency:
  group: conditioned-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-authored:
    name: Native authored shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NATIVE_SHARD: ${{ matrix.shard }}
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
      - name: Build isolated opt-in oracle bindings
        run: |
          python -m pip install 'jax==0.12.0' 'numpy==2.5.4' 'maturin>=1.5,<2'
          scripts/vendor_poke_engine_src.sh "$(command -v python)"
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml --no-default-features --features gen3 --test test_gen3
          POKEZERO_ENUMERATE_ROLLS=0 cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --test gen3_minimum_damage
          POKEZERO_ENUMERATE_ROLLS=1 cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --test gen3_minimum_damage
          POKEZERO_ENUMERATE_ROLLS=1 cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --test gen3_minimum_damage
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml --no-default-features --features conditioned-oracle --lib conditioned_resume
          POKEZERO_ENUMERATE_ROLLS=1 cargo test --manifest-path third_party/poke-engine-src/Cargo.toml --no-default-features --features conditioned-oracle --lib conditioned_step::tests -- --test-threads=1
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --lib conditioned_resume::tests
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --lib conditioned_step::tests
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --test gen3_natural_cure_cleanup
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --test gen3_stall_pp_after_gates
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --test gen3_choice_band_before_move
          PYO3_PYTHON="$(command -v python)" cargo test --manifest-path rust/pokezero-search/Cargo.toml --no-default-features --features conditioned-oracle --test gen3_choice_band_before_move
          python -m maturin build --manifest-path third_party/poke-engine-src/poke-engine-py/Cargo.toml --release --no-default-features --features conditioned-oracle --out /tmp/conditioned-wheels
          python -m maturin build --manifest-path rust/pokezero-search/Cargo.toml --release --no-default-features --features conditioned-oracle --out /tmp/conditioned-wheels
          python -m pip install /tmp/conditioned-wheels/*.whl
          python scripts/engine_build_fingerprint.py --write --after-two-consumer-rebuild
          python scripts/engine_build_fingerprint.py --check
      - name: Compare complete authored successors without skips
        env:
          POKEZERO_ENUMERATE_ROLLS: '1'
        run: |
          python - <<'PY'
          import os, unittest, pokezero_search
          assert pokezero_search.CONDITIONED_ORACLE_ENABLED
          names = [
              'tests.test_conditioned_native_resume', 'tests.test_conditioned_native_faint_replacements',
              'tests.test_conditioned_native_ordinary', 'tests.test_gpu_engine_carry_law',
              'tests.test_ordinary_carry_panel',
              'tests.test_constructor_provenance',
              'tests.test_conditioned_native_roles', 'tests.test_native_gen3_trace_entry',
              'tests.test_conditioned_native_deterministic_abilities',
              'tests.test_prospective_fidelity_panel', 'tests.test_panel_cost_integration',
              'tests.test_action_history_native',
              'tests.test_wish_history_native',
              'tests.test_rest_origin_native',
              'tests.test_native_gen3_natural_cure_cleanup',
              'tests.test_native_gen3_stall_pp', 'tests.test_gpu_engine_successor_cache',
              'tests.test_native_gen3_choice_band_before_move',
              'tests.test_native_gpu_secondary_move_effects',
              'tests.test_native_gpu_synchronize',
              'tests.test_gpu_engine_panel_owner',
              'tests.test_native_gpu_panel_execution']
          first = {
              'tests.test_conditioned_native_faint_replacements',
              'tests.test_ordinary_carry_panel', 'tests.test_constructor_provenance',
              'tests.test_conditioned_native_deterministic_abilities',
              'tests.test_action_history_native', 'tests.test_rest_origin_native',
              'tests.test_native_gen3_choice_band_before_move'}
          assert len(names) == len(set(names)) and first <= set(names)
          groups = [[name for name in names if name in first],
                    [name for name in names if name not in first]]
          assert set(groups[0]).isdisjoint(groups[1])
          assert set(groups[0]) | set(groups[1]) == set(names)
          assert unittest.defaultTestLoader.loadTestsFromNames(names).countTestCases() == 151
          shard = int(os.environ['NATIVE_SHARD'])
          assert shard in (0, 1)
          expected = (47, 104)[shard]
          suite = unittest.defaultTestLoader.loadTestsFromNames(groups[shard])
          assert suite.countTestCases() == expected
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun == expected and not result.skipped
          assert result.wasSuccessful()
          PY
  conditional-successors:
    name: conditional-successors
    if: ${{ always() }}
    needs: [native-authored]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every native authored shard
        env:
          RESULT: ${{ needs.native-authored.result }}
        run: |
          test "$RESULT" = success
