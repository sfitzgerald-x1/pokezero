      - name: The abort channel COMPILES -- `--features model`, which no job built before
        run: |
          set -o pipefail
          # WHY THIS STEP EXISTS. `tree.rs:305`'s abort gate is `allow(dead_code)` without the
          # `model` cargo feature, so every crate step above compiles the channel THIS
          # PR's class travels on out of the build entirely -- report 4 section 4.1, in the CI
          # config rather than in a measurement run. `model.rs` is likewise never compiled, and
          # the named `abort_telemetry::*` pins above are source-text assertions over
          # `include_str!("model.rs")` precisely because of that.
          #
          # WHAT IT BUYS, STATED EXACTLY, because overclaiming here would be the same defect in
          # the other direction. Measured on this tree: the executed test-NAME set is
          # IDENTICAL with and without the feature -- 519 names both ways, `comm` empty in both
          # directions. So this adds ZERO behavioural coverage of the abort gate; no crate test
          # reaches it. It buys compile coverage of `model.rs` and of the gate, and it removes
          # the `allow(dead_code)` masking. A behavioural gate on the abort channel needs the
          # truth-differential harness, which is not a CI job.
          #
          # THE LIBRARY-PATH TRAP, found by running it. `build.rs` embeds an rpath for the
          # maturin-built cdylib only, so `cargo test --features model` binaries do not get it
          # and abort at load with SIGABRT. cargo then prints `error: test failed` and NO
          # `test result: FAILED` line, so a step grepping only for that line would pass on a
          # run where nothing executed. `set -o pipefail` is what actually catches it; the
          # library path is what prevents it.
          python -m pip install --quiet torch==2.12.1 \
            --index-url https://download.pytorch.org/whl/cpu
          LIBTORCH_USE_PYTORCH=1 LIBTORCH_BYPASS_VERSION_CHECK=1 \
            LD_LIBRARY_PATH="$(python -c 'import torch,pathlib;print(pathlib.Path(torch.__file__).parent/"lib")')" \
            RUSTFLAGS="-C debug-assertions=yes" \
            cargo test --release --no-fail-fast --features model \
              --manifest-path rust/pokezero-search/Cargo.toml 2>&1 \
            | tee /tmp/cargo-model.log
          if grep -qE '^test result: FAILED' /tmp/cargo-model.log; then
            echo "::error::a crate suite failed under --features model"
            exit 1
          fi
          model_tests=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/cargo-model.log \
            | grep -oE '[0-9]+' | paste -sd+ - | bc)
          if [ "${model_tests:-0}" -lt 519 ]; then
            echo "::error::expected >= 519 crate tests under --features model, got ${model_tests:-0}"
            exit 1
          fi

      - name: The production-read pin runs at all -- build the native module and run it
        run: |
          set -o pipefail
          # `events.rs` names `tests/test_crate_protect_marker_state_reads.py` as THE pin for
          # the three state facts the Sleep Talk zero-heal guard reads, and no CI job ran it.
          # Adding it to a module list alone would not have been enough: the module is
          # `skipIf(pokezero_search is None)` and no job builds the native module, so it would
          # have SKIPPED and reported green -- an instrument that cannot report failure.
          # So the wheel is built first, and the skip is made loud below.
          maturin build --release --manifest-path rust/pokezero-search/Cargo.toml --out /tmp/wheels
          python -m pip install --quiet --force-reinstall --no-deps /tmp/wheels/*.whl
          python -c "import pokezero_search; print('native module ok')"
          python -m unittest tests.test_crate_protect_marker_state_reads -v 2>&1 \
            | tee /tmp/protectread.log
          # A SKIP HERE IS A FAILURE. The module's whole value is that it exercises the
          # production READ, which every crate unit test passes in as a literal.
          if grep -qE 'skipped|OK \(skipped' /tmp/protectread.log; then
            echo "::error::the production-read pin SKIPPED; the native module was not importable"
            exit 1
          fi
          # EXACT, in the shape #1204's scan pairs -- a `>=` comparison is unpairable and
          # showed up as a NEW blind spot in `test_the_guard_scan_coverage_triple_is_re_derived`
          # the moment this step was added. That gate is the reason this line is a literal.
          if ! grep -qE 'Ran 13 tests' /tmp/protectread.log; then
            echo "::error::the production-read pin did not run all 13 tests"
            exit 1
          fi

      - name: Assert the engine build stamp is current
        run: python scripts/engine_build_fingerprint.py --check

  # The seed registry, re-derived from the committed artifacts.
  #
  # DELIBERATELY NOT BEHIND THE `changes` FILTER, and deliberately not a step inside
  # `mass-gate`. Two reasons, both concrete:
  #
  #   1. Its only real input is `docs/engine_divergence_ledger_20260728.md` plus every
  #      committed JSON under `reports/` and `docs/`. Putting the ledger in the FILTERS
  #      list would fire the 60-minute engine build on every prose edit to a 5,000-line
  #      document, which is the surest way to get the filter narrowed again later.
  #      Leaving it out would let a PR that edits only the ledger -- which is exactly
  #      how the false final-holdout row got in -- skip the pin entirely.
  #   2. It imports nothing but the standard library, on purpose: no `poke_engine`, no
  #      Showdown checkout, no numpy. So it costs a checkout and 0.3 s, and it can run
  #      unconditionally without the "skips when the wheel is absent" failure this
  #      workflow's header forbids.
  #
  # What it pins: `tests/test_seed_registry_coverage.py`. Every fidelity seed
  # (`19,000,000`+) in the committed record lies inside a band the ledger's seed
  # registry records, and every band the registry records has a committed witness. At
  # `553cf2c3` the registry said the final-holdout block was "reserved, untouched"
  # while `reports/artifacts/c141_final_holdout_sweep.json` had swept 200 games of it,
  # and said the swept span was `19,200,000`-`19,200,199` when it was
  # `19,200,060`-`19,200,259`. Nothing parsed the table, so both stood.
  #
  # Its result is consumed by `gate-status` below, which is the only required context.
  # Running unconditionally is what makes the job unskippable; being in `gate-status`'s
  # `needs` is what makes it matter. The first revision had the first without the
  # second and was therefore advisory -- see the note on `gate-status`.
  #
  # `tests/test_seed_registry_coverage.py` is intentionally absent from the FILTERS
  # list above, and that is not the omission it looks like. Everything in that list is
  # there so a PR weakening a pin still trips `mass-gate`; this pin does not run in
  # `mass-gate` at all, and its own job has no filter, so a PR that weakens it runs it
  # by construction. Adding it to FILTERS would only start the engine build for a
  # module that does not use the engine.
  seed-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Seed registry coverage
        run: |
          set -o pipefail
          python -m unittest tests.test_seed_registry_coverage -v 2>&1 \
            | tee /tmp/seedregistry.log
          # EXACT, not a floor, for the reason #1163 established: a floor was the one
          # fail-open in its mutation battery. Note this guard lives in YAML and no
          # local `unittest` or `pytest` run can see it -- a module that grows without
          # its count following is how an approved PR reached CI red here before.
          # 27 -> 30 on review: the three pins that hold `_load_or_die` to raising
          # rather than swallowing a decode error, which is the fail-open the sibling
          # census removed and this module briefly reintroduced.
          # 30 -> 41 (C151): `TheRatifiedC151WindowIsNotYetSweptTests`, the eleven pins
          # that keep "RATIFIED" and "SWEPT" apart for `19,300,000`-`19,300,199` -- absent
          # from `REGISTERED_BANDS` because ratification is not a witness, disjoint from
          # every consumed band and from the burned block, untouched by any committed
          # artifact, and tied to `OWNER_RATIFIED` in the guard so the ledger row, the
          # prediction document and the code cannot drift apart. That class is meant to go
          # RED when the sweep lands, so this number drops back when it is deleted as part
          # of the ratification bookkeeping.
          #
          # NOTE for whoever edits that module next: it must keep running WITHOUT the
          # engine. This job is a bare checkout plus setup-python -- no build, no install --
          # so a plain `from engine_transition_differential import ...` raises
          # ModuleNotFoundError here while passing on any dev machine. That is why the
          # module reads the guard's constants with `ast` instead. See `guard_constant`.
          if ! grep -qE 'Ran 41 tests' /tmp/seedregistry.log; then
            echo "::error::expected 41 seed-registry pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. `TheSelectorItselfIsExercisedTests` and the two
          # corpus anti-vacuity pins are the only reason the coverage assertions mean
          # anything: skip them and every "no seed escapes its band" claim goes vacuous.
          if ! grep -qE '^OK$' /tmp/seedregistry.log; then
            echo "::error::seed-registry pins did not report a clean OK (skip or failure)"
            exit 1
          fi

  # The harness digest: the Python half of the measuring instrument, and the drift
  # that half has already produced.
  #
  # WHAT IT PINS: `tests/test_harness_digest_provenance.py`. The engine fingerprint
  # covers the patch set and the search crate and NOTHING under `scripts/` or
  # `src/pokezero/`, so a sweep's provenance names the engine and not the harness
  # that rendered both sides and decided what "matched" means. Over the committed
  # corpus that is not theoretical: 29 distinct engine fingerprints, SIX of them
  # spanning more than one `source_commit`, and one confirmed live -- dev
  # `strict:diverged_on_full_branch_set` = 1 on a fresh base build but absent from
  # the C142 artifact at the same fingerprint `5fa147ff`, because the counter landed
  # in the differential after C142's sweeps. `source_commit` made that DETECTABLE and
  # nothing asserted it.
  #
  # IT ALSO PINS THAT THE CLOSURE IS CLOSED, which is not the same assertion as the
  # membership list and is the one that matters most here. Review caught the first
  # revision of `scripts/harness_digest.py` dropping every relative import: the
  # closure came out at 16 files instead of 73, blind to `gen3_damage`,
  # `showdown_fixture` and `poke_engine_backend` -- all on the live sweep path --
  # while the exact-membership pin stayed green, because a list of what the resolver
  # FOUND cannot detect what it never looked for. `ClosureCompletenessTests`
  # re-derives relative-import targets with an independent implementation and is
  # what makes a future truncation red by construction.
  #
  # SAME SHAPE AS `seed-registry` ABOVE, and for the same two reasons:
  #
  #   1. DELIBERATELY NOT BEHIND THE `changes` FILTER. Its inputs include every
  #      committed JSON under `reports/` and `docs/`, and putting those behind the
  #      filter would fire the 60-minute engine build on every artifact edit; leaving
  #      them out would let a PR that only adds an artifact skip the pin entirely.
  #      Running unconditionally costs a checkout and ~2 s.
  #   2. It imports nothing but the standard library plus two stdlib-only repo
  #      modules loaded BY FILE LOCATION (`scripts/harness_digest.py`,
  #      `scripts/engine_build_fingerprint.py`). No `poke_engine`, no Showdown
  #      checkout. The differential is read with `ast`, never imported -- a plain
  #      `import engine_transition_differential` raises ModuleNotFoundError on this
  #      bare checkout while passing on any dev machine. See that module's header.
  #
  # Its result is consumed by `gate-status` below, which is the only required
  # context. Running unconditionally is what makes the job unskippable; being in
  # `gate-status`'s `needs` is what makes it MATTER. This repo has found four inert
  # pins, the last a CI job whose result nothing consumed -- see the note on
  # `gate-status`. Both halves are present here by construction.
  harness-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harness digest and provenance drift
        run: |
          set -o pipefail
          python -m unittest tests.test_harness_digest_provenance -v 2>&1 \
            | tee /tmp/harness.log
          # EXACT, not a floor -- a floor was the one fail-open in #1163's mutation
          # battery. This guard lives in YAML and no local `unittest` or `pytest` run
          # can see it: a module that grows without its count following is how an
          # approved PR reached CI red here before.
          if ! grep -qE 'Ran 28 tests' /tmp/harness.log; then
            echo "::error::expected 28 harness-digest pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. The anti-vacuity pins -- the selector's blob
          # count, the non-empty `build_inputs()`, the named world/matcher/adapter
          # members of the closure, and the naive relative-import scan that keeps the
          # COMPLETENESS pin from passing over an empty set -- are the only reason the
          # coverage claims mean anything; skip them and every statement about what
          # the digest covers goes vacuous.
          if ! grep -qE '^OK$' /tmp/harness.log; then
            echo "::error::harness-digest pins did not report a clean OK (skip or failure)"
            exit 1
          fi

      - name: The digest is computable on a bare checkout
        run: |
          set -euo pipefail
          # The unittest run above loads the module by file location. This proves the
          # shipped CLI path works too, with no repo modules on sys.path and no engine
          # installed -- which is the state a fresh operator is in when they go to
          # record what harness produced a sweep.
          python scripts/harness_digest.py --print

      # A gate no job runs is not a gate. This workflow names test modules one by one,
      # so a NEW module is invisible to CI by default -- #1212 had to add its own step
      # for exactly this reason. Named here rather than left to a discovery run.
      - name: Truth-injection differential instrument
        run: |
          set -o pipefail
          python -m unittest tests.test_truth_differential -v 2>&1 | tee /tmp/truthdiff.log
          # EXACT, not a floor. A floor was the one fail-open in #1163's mutation
          # battery, and this guard lives in YAML where no local run can see it.
          if ! grep -qE 'Ran 44 tests' /tmp/truthdiff.log; then
            echo "::error::expected 44 truth-differential tests; the suite shrank or grew"
            exit 1
          fi
          # THE pins, named. `ForcedRefusalTests` is the reason the census number can be
          # believed at all: an instrument that cannot report failure will report
          # success, and this campaign has hit that repeatedly. These four run on a bare
          # runner (no Showdown checkout), so unlike the plan/truth-source classes
          # they must never skip. The spelling here is deliberate: the register's
          # `test_the_workflow_scan_sees_the_comment_it_excludes` counts lines in this
          # file containing the hyphenated checkout name and requires exactly one, so a
          # second mention here would turn a control into a failure.
          for pin in \
            test_a_forced_construction_refusal_is_counted_and_attributed \
            test_forcing_the_truth_arm_leaves_the_production_arm_byte_identical \
            test_the_READER_reports_every_counter_that_moved_not_the_first \
            test_an_unavailable_truth_is_an_instrument_gap_not_an_acceptance \
            test_the_producer_is_still_first_refuser_across_stages \
            test_the_module_does_not_claim_more_than_it_does \
            test_construct_forcing_actually_raises \
            test_abort_forcing_patches_the_instance_not_the_module \
            test_a_crate_without_the_model_feature_is_refused \
            test_round_zero_is_recorded_as_zero \
            test_a_construction_refusal_still_yields_a_mapping_reading \
            test_the_probe_is_not_vacuous_on_an_ordinary_request \
            test_a_request_with_no_legal_candidates_is_silent_not_a_finding \
            test_unmapped_persistent_still_forces_after_the_decision_returns \
            test_the_docstring_disclaims_the_era_launch_trigger ; do
            # `-A2` because unittest -v puts a docstring's first line between the
            # test name and its verdict.
            if ! grep -A2 -E "^${pin} " /tmp/truthdiff.log | grep -qE '\.\.\. ok$'; then
              echo "::error::instrument pin ${pin} did not run and pass"
              exit 1
            fi
          done
          if ! grep -qE "^OK( \(skipped=[34]\))?$" /tmp/truthdiff.log; then
            echo "::error::truth-differential suite must be OK, with only environment-gated skips"
            exit 1
          fi

  # THE REQUIRED CHECK. Runs on every pull request, whatever it touches, so it can
  # always report. It is the only job in this workflow that should ever be marked
  # required in branch protection -- requiring `mass-gate` directly would block any
  # PR that does not touch the fidelity paths, because a skipped job never reports.
  #
  # Fails when the gates ran and failed, and when they were cancelled or errored.
  # Passes only on success or on a deliberate skip. `if: always()` is load-bearing:
  # without it this job inherits the skip and stops reporting, restoring exactly the
  # hole it exists to close.
  #
  # `seed-registry` IS IN `needs`, and that is not decoration. Branch protection
  # requires exactly one context -- this one -- so a job absent from this list runs,
  # goes red, and changes nothing: branch protection is satisfied by a green
  # `gate-status` that never looked at it. The first revision of the seed-registry job
  # had precisely that shape, and it was observed live: `seed-registry pass 8s` beside
  # `gate-status pass 3s`, the reporter returning before the job it was meant to
  # report on could have mattered. That is the four-inert-pins hazard one level up --
  # the job executes, the guard fires, and nothing depends on the result. Any job
  # added to this workflow must be added here too, or it is advisory.
  gate-status:
    needs: [changes, mass-gate, seed-registry, harness-provenance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the fidelity gate result
        env:
          TOUCHED: ${{ needs.changes.outputs.fidelity }}
          RESULT: ${{ needs.mass-gate.result }}
          FILTER: ${{ needs.changes.result }}
          REGISTRY: ${{ needs.seed-registry.result }}
          HARNESS: ${{ needs.harness-provenance.result }}
        run: |
          set -euo pipefail
          echo "changes result: ${FILTER}"
          echo "fidelity paths touched: ${TOUCHED}"
          echo "mass-gate result: ${RESULT}"
          echo "seed-registry result: ${REGISTRY}"
          echo "harness-provenance result: ${HARNESS}"

          # The seed registry, checked FIRST and with no case analysis, because there
          # is none to do: `seed-registry` carries no `if:`, depends on no other job,
          # and needs no wheel, so `skipped` is not reachable for it the way it is for
          # `mass-gate`. Anything that is not `success` -- failure, cancelled, or the
          # empty string a job that never ran leaves behind -- is a red gate. Demanding
          # the positive rather than excluding a list of negatives is the same shape
          # the TOUCHED check below settled on, and for the same reason: the excluded
          # list is what goes stale.
          if [ "${REGISTRY}" != "success" ]; then
            echo "::error::the seed-registry pins did not pass (${REGISTRY}); the fidelity seed registry in docs/engine_divergence_ledger_20260728.md no longer agrees with the committed artifacts"
            exit 1
          fi

          # The harness digest, checked with the same shape and for the same reason:
          # `harness-provenance` carries no `if:`, depends on no other job, and needs
          # no wheel, so `skipped` is not reachable for it. Demand the positive rather
          # than exclude a list of negatives -- the excluded list is what goes stale --
          # so `failure`, `cancelled`, and the empty string a job that never ran leaves
          # behind are all red.
          if [ "${HARNESS}" != "success" ]; then
            echo "::error::the harness-digest pins did not pass (${HARNESS}); the Python half of the measuring instrument is unidentified, or an engine fingerprint now spans a different set of source commits than the six historical groups"
            exit 1
          fi

          # The filter job must have SUCCEEDED before its output means anything.
          # Without this, a failed or cancelled `changes` job leaves TOUCHED as the
          # empty string -- not "false" -- and `mass-gate` reads `skipped` because
          # its dependency never succeeded. The skipped arm's `= "true"` guard does
          # not fire on "", so this job printed "gates correctly not run" and exited
          # 0: a green REQUIRED check on a PR whose gates never ran. There is no
          # `concurrency:` block in this repo, so the only thing that cancels a run
          # is a person -- which made an 11-second window in which anyone with write
          # access could cancel `changes` and mint themselves a passing gate.
          if [ "${FILTER}" != "success" ]; then
            echo "::error::the path-filter job did not succeed (${FILTER}); the gates did not run"
            exit 1
          fi
          # And demand an explicit negative rather than "anything that is not true".
          if [ "${TOUCHED}" != "true" ] && [ "${TOUCHED}" != "false" ]; then
            echo "::error::path filter produced no verdict (fidelity='${TOUCHED}')"
            exit 1
          fi

          case "${RESULT}" in
            success)
              echo "engine fidelity gates passed"
              ;;
            skipped)
              if [ "${TOUCHED}" = "true" ]; then
                echo "::error::mass-gate skipped while fidelity paths WERE touched"
                exit 1
              fi
              echo "no fidelity-relevant paths changed; gates correctly not run"
              ;;
            *)
              echo "::error::engine fidelity gates did not pass (mass-gate: ${RESULT})"
              exit 1
              ;;
          esac
