  python-floor-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --quiet 'ruff==0.16.2'

      - name: The gate reddens on known-bad input
        run: |
          set -o pipefail
          set +e
          python scripts/check_python_floor_syntax.py --self-test 2>&1 | tee /tmp/floorselftest.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::the floor gate failed its own kill-confirm (exit $rc); the run below"
            echo "::error::cannot be trusted -- it would report green without checking anything."
            exit 1
          fi
          if ! grep -q 'self-test OK: ruff rejects' /tmp/floorselftest.log; then
            echo "::error::self-test exited 0 without its success line -- output shape changed"
            exit 1
          fi

      - name: Python floor syntax gate
        run: |
          set -o pipefail
          set +e
          python scripts/check_python_floor_syntax.py 2>&1 | tee /tmp/floorsyntax.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::the floor-syntax gate could not run (exit 2) -- not treated as green"
            exit 1
          fi
          if [ "$rc" -ne 0 ]; then
            echo "::error::tracked file(s) use syntax newer than requires-python declares"
            exit 1
          fi
          if ! grep -q 'every tracked .py file parses on' /tmp/floorsyntax.log; then
            echo "::error::gate exited 0 without its success line -- output shape changed"
            exit 1
          fi


  schema-container-census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The tree censused is the MERGE result, not the branch tip
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse HEAD)
          echo "censusing ${head_commit}; PR head is ${HEAD_SHA}"

          if [ "${head_commit}" = "${HEAD_SHA}" ]; then
            echo "::error::HEAD is the PR head itself, so the census is counting the BRANCH TIP"
            echo "::error::rather than the merge result. Remove the \`ref:\` from this job's"
            echo "::error::checkout; whole-file counts must derive from the merge ref."
            exit 1
          fi

          if ! second_parent=$(git rev-parse --verify --quiet 'HEAD^2'); then
            echo "::error::HEAD has no second parent, so this is not a merge commit -- the census"
            echo "::error::would count a single-parent tree (the base tip, or the PR head) rather"
            echo "::error::than the merge result. Check \`fetch-depth\` is still at least 2 and that"
            echo "::error::no \`ref:\` has been added to this job's checkout."
            exit 1
          fi
          if [ "${second_parent}" != "${HEAD_SHA}" ]; then
            echo "::error::HEAD^2 is ${second_parent}, not the PR head ${HEAD_SHA}; the tree"
            echo "::error::censused is not the merge of this pull request."
            exit 1
          fi
          echo "confirmed: HEAD is the merge of the base with PR head ${HEAD_SHA}"

      - name: The census reddens on known-bad input
        run: |
          set -euo pipefail
          spec=tests/data/schema_drill_schema_containers.txt
          fail=0

          build() {
            scratch="${RUNNER_TEMP}/census-kill-confirm/$1"
            rm -rf "${scratch}"
            mkdir -p "${scratch}/tests/data"
            cp -R src scripts "${scratch}/"
            cp "${spec}" "${scratch}/tests/data/"
          }

          expect() {
            set +e
            python "${scratch}/scripts/schema_container_census.py" > "${scratch}/census.log" 2>&1
            rc=$?
            set -e
            if [ "${rc}" -ne "$2" ]; then
              echo "::error::kill-confirm case '$1' returned ${rc}, wanted $2"
              sed 's/^/    | /' "${scratch}/census.log"
              fail=1
            elif ! grep -qF "$3" "${scratch}/census.log"; then
              echo "::error::kill-confirm case '$1' returned $2 but NOT via the abort it names:"
              echo "::error::the census never printed '$3'. Four aborts return 15, so the code"
              echo "::error::alone does not identify which one fired -- this case is no longer"
              echo "::error::exercising the check it was written for."
              sed 's/^/    | /' "${scratch}/census.log"
              fail=1
            else
              echo "  kill-confirm '$1': exit ${rc} via '$3', as expected"
            fi
          }

          build unclassified
          printf 'KILL_CONFIRM_TABLE = {"v3", "v4"}\n' \
            > "${scratch}/src/pokezero/zz_census_kill_confirm.py"
          expect "unclassified container" 15 "needs its own row"

          build classflip
          perl -0pi -e 's/^REGISTER(\s+src\/pokezero\/rollout_cli\.py)/PARTIAL $1/m' \
            "${scratch}/tests/data/schema_drill_schema_containers.txt"
          expect "REGISTER demoted to PARTIAL" 15 "per-file classification counts do not match"

          build conflict
          grep -m1 '^REGISTER' "${spec}" | sed 's/^REGISTER/PARTIAL /' \
            >> "${scratch}/tests/data/schema_drill_schema_containers.txt"
          expect "conflicting duplicate row" 1 "CONFLICTING rows for"

          build collapse
          printf 'def f(x):\n    return x in {"v3", "v4"} or x in {"v3", "v4"}\n' \
            > "${scratch}/src/pokezero/zz_census_collapse.py"
          printf 'PARTIAL   src/pokezero/zz_census_collapse.py  v3,v4  <inline:2>\n' \
            >> "${scratch}/tests/data/schema_drill_schema_containers.txt"
          expect "two containers collapsed onto one line" 15 "container node(s) collapsed into"

          build clean
          expect "unperturbed copy (negative control)" 0 "every schema-name container is classified"

          if [ "${fail}" -ne 0 ]; then
            echo "::error::the census failed its own kill-confirm, so the run below cannot be"
            echo "::error::trusted -- it would report green without checking what it claims to."
            exit 1
          fi

      - name: Schema-container census
        run: |
          set -o pipefail
          rc=0
          python scripts/schema_container_census.py || rc=$?
          echo "census exit code: ${rc}"
          if [ "${rc}" -eq 15 ]; then
            echo "::error::the schema-container census aborted. A container of schema names in"
            echo "::error::src/ or scripts/ is unclassified, a classification row matches no"
            echo "::error::container, two containers collapsed onto one spec row, or the per-class"
            echo "::error::counts drifted from the pin. Read the abort above and fix"
            echo "::error::tests/data/schema_drill_schema_containers.txt -- an unregistered"
            echo "::error::container makes its consumers fail on the drill's own omission, and"
            echo "::error::NINE schema-keyed structures went unregistered that way, one at a time."
            exit 1
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "::error::the schema-container census could not run (exit ${rc}) -- not treated"
            echo "::error::as green. A malformed, duplicated or conflicting classification row"
            echo "::error::exits 1 here, as does a crash."
            exit 1
          fi

      - name: The census wiring pins
        run: |
          set -o pipefail
          rc=0
          log=$(python -m unittest tests.test_schema_container_census_wiring -v 2>&1) || rc=$?
          printf '%s\n' "${log}"
          if [ "${rc}" -ne 0 ]; then
            echo "::error::the census wiring pins did not pass (the runner exited ${rc}). Every"
            echo "::error::structural, consumption and behavioural pin on the schema-container"
            echo "::error::census job is asserted by that module and by nothing else."
            exit 1
          fi
          last=${log##*$'\n'}
          without_last=${log%$'\n'*}
          without_two=${without_last%$'\n'*}
          summary=${without_two##*$'\n'}
          if [ "${last}" != "OK" ]; then
            echo "::error::the census wiring pins did not END in a clean OK (skip, failure, or"
            echo "::error::output written after the runner finished). Last line: ${last}"
            exit 1
          fi
          if ! grep -qE '^Ran 32 tests in ' <<<"${summary}"; then
            echo "::error::expected 32 census-wiring pins as the runner's own summary line; the"
            echo "::error::suite shrank, grew, or that line is not the runner's. Update this count"
            echo "::error::and the module's own guard assertion in the same commit. Saw: ${summary}"
            exit 1
          fi


  gate-status:
    needs: [changes, mass-gate, schema-default, seed-registry, harness-provenance, python-floor-syntax, schema-container-census]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the fidelity gate result
        env:
          TOUCHED: ${{ needs.changes.outputs.fidelity }}
          SCHEMA_TOUCHED: ${{ needs.changes.outputs.schema_default }}
          RESULT: ${{ needs.mass-gate.result }}
          SCHEMA: ${{ needs.schema-default.result }}
          FILTER: ${{ needs.changes.result }}
          REGISTRY: ${{ needs.seed-registry.result }}
          HARNESS: ${{ needs.harness-provenance.result }}
          FLOOR: ${{ needs.python-floor-syntax.result }}
          CENSUS: ${{ needs.schema-container-census.result }}
        run: |
          set -euo pipefail
          echo "changes result: ${FILTER}"
          echo "fidelity paths touched: ${TOUCHED}"
          echo "schema-default paths touched: ${SCHEMA_TOUCHED}"
          echo "mass-gate result: ${RESULT}"
          echo "schema-default result: ${SCHEMA}"
          echo "seed-registry result: ${REGISTRY}"
          echo "harness-provenance result: ${HARNESS}"
          echo "python-floor-syntax result: ${FLOOR}"
          echo "schema-container-census result: ${CENSUS}"

          if [ "${REGISTRY}" != "success" ]; then
            echo "::error::the seed-registry pins did not pass (${REGISTRY}); the fidelity seed registry in docs/engine_divergence_ledger_20260728.md no longer agrees with the committed artifacts"
            exit 1
          fi

          if [ "${HARNESS}" != "success" ]; then
            echo "::error::the harness-digest pins did not pass (${HARNESS}); the Python half of the measuring instrument is unidentified, or an engine fingerprint now spans a different set of source commits than the six historical groups"
            exit 1
          fi

          if [ "${FLOOR}" != "success" ]; then
            echo "::error::the declared-floor syntax gate did not pass (${FLOOR}); a tracked file uses syntax newer than requires-python declares, or the gate could not run -- either way the floor is unverified"
            exit 1
          fi

          if [ "${CENSUS}" != "success" ]; then
            echo "::error::the schema-container census did not pass (${CENSUS}); a container of schema names in src/ or scripts/ is unclassified, a classification row is stale, duplicated or self-contradictory, or the per-class counts drifted from their pin -- either way the rotation drill cannot know where to register a synthetic schema"
            exit 1
          fi

          if [ "${FILTER}" != "success" ]; then
            echo "::error::the path-filter job did not succeed (${FILTER}); the gates did not run"
            exit 1
          fi
          if [ "${TOUCHED}" != "true" ] && [ "${TOUCHED}" != "false" ]; then
            echo "::error::path filter produced no verdict (fidelity='${TOUCHED}')"
            exit 1
          fi
          if [ "${SCHEMA_TOUCHED}" != "true" ] && [ "${SCHEMA_TOUCHED}" != "false" ]; then
            echo "::error::path filter produced no schema-default verdict (schema_default='${SCHEMA_TOUCHED}')"
            exit 1
          fi
          if [ "${SCHEMA_TOUCHED}" = "true" ] && [ "${SCHEMA}" != "success" ]; then
            echo "::error::schema-default gate did not pass (${SCHEMA})"
            exit 1
          fi
          if [ "${SCHEMA_TOUCHED}" = "false" ] && [ "${SCHEMA}" != "skipped" ]; then
            echo "::error::schema-default gate ran despite no schema-default path change (${SCHEMA})"
            exit 1
          fi

          case "${RESULT}" in
            success)
              echo "engine fidelity gates passed"
              ;;
            skipped)
              if [ "${TOUCHED}" = "true" ]; then
                echo "::error::mass-gate skipped while fidelity paths WERE touched"
                exit 1
              fi
              echo "no fidelity-relevant paths changed; gates correctly not run"
              ;;
            *)
              echo "::error::engine fidelity gates did not pass (mass-gate: ${RESULT})"
              exit 1
              ;;
          esac
