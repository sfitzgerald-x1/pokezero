  schema-default:
    needs: changes
    if: needs.changes.outputs.schema_default == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Schema-default conflation gate
        run: |
          set -o pipefail
          python -m unittest tests.test_schema_default_ledger tests.test_schema_with_selector -v \
            2>&1 | tee /tmp/schemagate.log
          if tail -5 /tmp/schemagate.log | grep -qE 'skipped=[0-9]+|OK \(skipped'; then
            echo "::error::the schema-default gate SKIPPED -- the ledger could not measure the tree"
            exit 1
          fi
          if ! grep -qE 'Ran 25 tests' /tmp/schemagate.log; then
            echo "::error::expected 25 tests across the ledger gate and the selector; suite changed"
            exit 1
          fi

