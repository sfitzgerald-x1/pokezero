name: Engine fidelity qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Checkout pinned Pokemon Showdown for model-path arbiter tests
        uses: actions/checkout@v5
        with:
          repository: smogon/pokemon-showdown
          ref: f76228a1354b5d0f307ca2d16101294ad3a2308b
          path: .ci/pokemon-showdown
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: .ci/pokemon-showdown/package-lock.json

      - name: Build pinned Pokemon Showdown for model-path arbiter tests
        run: |
          set -o pipefail
          npm ci --prefix .ci/pokemon-showdown
          npm run build --prefix .ci/pokemon-showdown
          test -f .ci/pokemon-showdown/dist/sim/dex.js

      # Patch-stack tamper tests fetch the pinned upstream sdist through uv.

      - uses: astral-sh/setup-uv@v6

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/pokezero-search

      - name: Install build tooling
        # Native one-ply routing also executes the declared SciPy LP solver.
        run: python -m pip install -e '.[analysis]' maturin numpy

      - name: Patch stack integrity
        run: python -m scripts.run_ci_unittest tests.test_poke_engine_patch_stack

      - name: Build and install the gen3 engine and the search crate
        run: bash scripts/build_search_crate_engine.sh

      - name: Synthetic Struggle on the freshly built native consumers
        run: python -m scripts.run_ci_unittest tests.test_native_synthetic_struggle

      - name: Fresh freeze before the queued Gen3 action
        run: python -m scripts.run_ci_unittest tests.test_native_gen3_freeze_gate

      - name: Inert Substitute storage and Gen3 continuation/entry/gender/weather controls
        run: python -m scripts.run_ci_unittest tests.test_native_gen3_substitute_future tests.test_native_gen3_speed_boost_entry tests.test_native_gen3_gender_future tests.test_native_gen3_weather_future

      - name: Behavioural probes
        run: python scripts/engine_behavioral_probes.py

      - name: Engine gen3 suite
        run: |
          set -o pipefail
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml \
            --no-default-features --features gen3 --test test_gen3 2>&1 \
            | tee /tmp/gen3suite.log
          if ! grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' \
              /tmp/gen3suite.log; then
            echo "::error::no successful unskipped gen3 suite"
            exit 1
          fi
          for pin in \
            test_rest_refund_is_credited_on_switch_in \
            test_rest_refund_is_clamped_to_the_legal_maximum \
            test_rest_refund_is_credited_before_spikes_damage \
            test_ordinary_sleep_never_receives_a_rest_refund \
            test_switch_in_of_a_healthy_mon_emits_nothing \
            test_natural_wake_voids_a_pending_rest_refund \
            test_early_bird_wake_voids_a_pending_rest_refund \
            test_a_cured_sleep_voids_a_pending_rest_refund \
            test_a_non_sleep_usable_attempt_discards_the_refund \
            test_a_sleep_usable_attempt_banks_a_turn \
            test_using_rest_again_discards_the_previous_stints_refund \
            test_a_non_rest_sleeper_with_a_stale_bank_is_not_credited \
            test_early_bird_staying_asleep_discards_the_refund \
            foulplay_invalidweight_witness_has_no_invalid_chance_arm \
            foulplay_seeded_mcts_repeats_exactly \
            immobilization_marker_apply_then_reverse_is_bit_identical \
            immobilization_marker_apply_alone_does_not_change_the_state \
            immobilization_markers_are_distinguishable_from_each_other_and_from_nothing \
            both_gen3_immobilizers_mark_their_branch_with_their_own_reason; do
            grep -qxE "test $pin \.\.\. ok" /tmp/gen3suite.log || {
              echo "::error::gen3 pin did not run: $pin"
              exit 1
            }
          done

      - name: Engine lib suite
        run: |
          set -o pipefail
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml \
            --no-default-features --features gen3 --lib 2>&1 \
            | tee /tmp/gen3lib.log
          if ! grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' \
              /tmp/gen3lib.log; then
            echo "::error::no successful unskipped gen3 library suite"
            exit 1
          fi
          for pin in \
            engine::accuracy::tests::pinned_all_102414_numeric_event_cells \
            engine::accuracy::tests::source_integer_fractional_and_ieee_boundaries \
            engine::accuracy::tests::type_status_always_hit_weather_and_current_abilities \
            instruction::test::test_instruction_size \
            state::rest_sleep_pending_refund_tests::apply_then_reverse_is_bit_identical \
            state::rest_sleep_pending_refund_tests::refund_round_trips_without_a_pre_transform \
            state::rest_sleep_pending_refund_tests::zero_refund_is_omitted_from_serialization \
            state::rest_sleep_pending_refund_tests::a_pre_field_serialization_still_parses; do
            grep -qxE "test $pin \.\.\. ok" /tmp/gen3lib.log || {
              echo "::error::engine lib pin did not run: $pin"
              exit 1
            }
          done

      - name: Model-feature abort seam
        run: |
          set -o pipefail
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName(
              'tests.test_model_ci_library_path.ModelRuntimePathTests.test_model_step_preserves_python_and_torch_library_directories')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped or not result.testsRun:
              raise SystemExit(1)
          PY
          python -m pip install --quiet torch==2.13.0 \
            --index-url https://download.pytorch.org/whl/cpu
          LIBTORCH_USE_PYTORCH=1 \
            LD_LIBRARY_PATH="$(python -c 'import torch,pathlib;print(pathlib.Path(torch.__file__).parent/"lib")')${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
            RUSTFLAGS="-C debug-assertions=yes" \
            cargo test --release --features model --lib \
              tree::model_abort_seam_tests::the_gated_abort_seam_rejects_an_attribution_unsafe_branch_with_its_predicate \
              --manifest-path rust/pokezero-search/Cargo.toml 2>&1 \
            | tee /tmp/cargo-model.log
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' /tmp/cargo-model.log
          gated=tree::model_abort_seam_tests::the_gated_abort_seam_rejects_an_attribution_unsafe_branch_with_its_predicate
          grep -qxE "test $gated \.\.\. ok" /tmp/cargo-model.log || {
            echo "::error::the model-gated abort-seam pin did not run"
            exit 1
          }

      - name: The production-read pin runs against the freshly installed engine consumer
        run: |
          python -c "import pokezero_search; print('native module ok')"
          python -m scripts.run_ci_unittest tests.test_crate_protect_marker_state_reads

      - name: Rollout-leaf arbiter and FoulPlay calibration contracts run on the model wheel
        env:
          POKEZERO_SHOWDOWN_ROOT: ${{ github.workspace }}/.ci/pokemon-showdown
        run: |
          set -o pipefail
          rollout_leaf_torch_lib="$(python -c 'import torch,pathlib;print(pathlib.Path(torch.__file__).parent/"lib")')"
          export LD_LIBRARY_PATH="${rollout_leaf_torch_lib}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          LIBTORCH_USE_PYTORCH=1 python -m maturin build \
            --release --features model --manifest-path rust/pokezero-search/Cargo.toml \
            --skip-auditwheel -i "$(command -v python)" --out /tmp/rollout-leaf-wheels
          python -m pip install --quiet --force-reinstall --no-deps /tmp/rollout-leaf-wheels/*.whl
          python -c "import pokezero_search; print('model wheel ok')"
          python -m scripts.run_ci_unittest tests.test_rollout_model_priors \
            tests.test_mcts_acceptance_report \
            tests.test_rollout_leaf_arbiter \
            tests.test_rollout_leaf_witness_mutation_battery \
            tests.test_price_uniform_rollout_leaves \
            tests.test_convert_value_head \
            tests.test_value_head_capacity \
            tests.test_foulplay_paired_eval \
            tests.test_foulplay_budget_calibration \
            tests.test_battle_bridge_boundary_requests
          python scripts/engine_build_fingerprint.py --write --after-two-consumer-rebuild

      - name: Synthetic Struggle on the model wheel
        run: |
          struggle_torch_lib="$(python -c 'import torch,pathlib;print(pathlib.Path(torch.__file__).parent/"lib")')"
          export LD_LIBRARY_PATH="${struggle_torch_lib}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          python -m scripts.run_ci_unittest tests.test_native_synthetic_struggle

      - name: Private-safe own-policy opponent contracts on the model wheel
        env:
          POKEZERO_SHOWDOWN_ROOT: ${{ github.workspace }}/.ci/pokemon-showdown
          PYTHONPATH: src:tests
        run: |
          set -o pipefail
          python -m scripts.run_ci_unittest \
            tests.test_policy_opponent_engine tests.test_policy_opponent \
            tests.test_policy_opponent_view tests.test_policy_opponent_request \
            tests.test_policy_opponent_profile tests.test_policy_opponent_refusal_repairs \
            tests.test_policy_opponent_refusal_note \
            tests.test_policy_opponent_public_trap \
            tests.test_policy_opponent_trace_projection \
            tests.test_policy_opponent_pending_commitment \
            tests.test_policy_opponent_trap_boundary \
            tests.test_policy_request_observer \
            tests.test_engine_world.BattleSpecConstructionTests.test_double_faint_replacement_marks_both_sides_in_either_seat \
            tests.test_engine_world.BattleSpecConstructionTests.test_double_faint_materialization_reaches_native_switch_request_not_wait \
            tests.test_engine_world.BattleSpecConstructionTests.test_replacement_phase_does_not_promote_a_living_opponent \
            tests.test_engine_world.BattleSpecConstructionTests.test_replacement_flags_match_pinned_showdown_faint_path \
            tests.test_engine_world.BatonPassBoundaryTests \
            tests.test_policy_opponent_native.NativePolicyOpponentSearchTest \
            tests.test_policy_opponent_native.NativeCanonicalOwnPolicyTest
          torch_lib="$(python -c 'import torch,pathlib;print(pathlib.Path(torch.__file__).parent/"lib")')"
          export LD_LIBRARY_PATH="$torch_lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          LIBTORCH_USE_PYTORCH=1 \
            cargo test --release --features model --lib policy_bridge::tests \
            --manifest-path rust/pokezero-search/Cargo.toml 2>&1 \
            | tee /tmp/policy-opponent-bridge.log
          grep -qE '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored' /tmp/policy-opponent-bridge.log

      - name: Assert the engine build stamp is current
        run: python scripts/engine_build_fingerprint.py --check
