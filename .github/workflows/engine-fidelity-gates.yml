name: Engine fidelity gates

# C116 Phase 1 item 4, the wiring half. The mass gate and the behavioural probes are
# the only instruments that can see defects the transition differential is structurally
# blind to -- anything that moves probability mass between branches while leaving each
# branch's damage components intact. Before this workflow existed, nothing ran them:
# the two other workflows run six named modules between them and neither builds
# poke_engine, so `tests/test_branch_mass_reconstruction.py` was a standing test that
# nothing executed. Adversarial review had to substitute for it three times.
#
# THE IMPORTS ARE DELIBERATELY HARD. Do not "fix" a missing-wheel failure with
# try/except ImportError + skipIf, the convention some other engine tests use. A gate
# that skips when the wheel is absent is precisely how the previous era's fixtures read
# PASS while asserting nothing -- six of them. If the wheel will not build, this job
# must go red, not green-with-a-skip.

on:
  pull_request:
jobs:
  # The path filter used to live on the workflow trigger. A REQUIRED status check
  # cannot be path-filtered that way: on a PR that touches none of these paths the
  # workflow never starts, the check never reports, and the PR is blocked forever
  # waiting for a job that will not run. So the trigger is unconditional and the
  # filtering moved here, with `gate-status` below reporting on every PR.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      fidelity: ${{ steps.f.outputs.fidelity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          FILTERS: |
            third_party/poke-engine-gen3-*.patch
            third_party/poke-engine-gen3-patches.txt
            rust/pokezero-search/**
            scripts/apply_poke_engine_patches.py
            scripts/build_search_crate_engine.sh
            scripts/setup_poke_engine.sh
            scripts/vendor_poke_engine_src.sh
            scripts/engine_behavioral_probes.py
            scripts/engine_build_fingerprint.py
            scripts/verify_poke_engine_source.py
            third_party/poke-engine-base-source.json
            tests/test_branch_mass_reconstruction.py
            # C152's pool census: the measurement behind the one owed family discharged
            # by a reachability VERDICT rather than a fixture. Listed for the same
            # reason the collapsed-arm oracle's pair is listed below -- a PR that
            # DELETES the artifact or its generator would otherwise trip no workflow at
            # all, which is the failure mode this file forbids twice. The mass-gate step
            # reads the artifact, so a deletion reddens once the job actually runs.
            tests/data/c152_pool_reachability_census.json
            scripts/c152_pool_reachability_census.py
            # Without these the classifier half of B1 -- which edits the differential --
            # triggers no workflow at all. Found by review of #1081.
            scripts/engine_transition_differential.py
            # The harness digest. It is IMPORTED by the differential, so breaking it
            # breaks every mass-gate step that loads the differential; and it is a
            # member of its own closure, so editing it moves the harness identity
            # stamped into every sweep. Its own pin file is listed for the reason every
            # other pin file here is -- a PR whose only change weakens it must still
            # trip this workflow -- and it additionally has an unconditional job of its
            # own below, `harness-provenance`.
            scripts/harness_digest.py
            tests/test_harness_digest_provenance.py
            # The final-holdout guard's pins. Listed so a PR that ONLY weakens the
            # pin file still trips this workflow -- otherwise the guard could be
            # disarmed by a test-only edit that never triggers its own gate.
            tests/test_final_holdout_guard.py
            # The coverage-bound pins. Listed so a PR that only weakens them still
            # trips this workflow.
            tests/test_single_seat_coverage_bound.py
            # C144's boundary verdict partition. The COVERAGE partition above and this
            # VERDICT partition are different partitions of different sets, and
            # conflating them is what produced the false two-term identity. Listed with
            # a STEP below, and with its two counterexample artifacts, so a PR that
            # deletes either one cannot go green without tripping this workflow.
            tests/test_boundary_verdict_partition.py
            scripts/cert_sweep_readout.py
            reports/c26_structural_probe_report.json
            reports/c27_structural_probe_report.json
            # C146's never-fired census, which re-derives §3.5's absence lists from the
            # artifacts instead of restating them. Its taxonomy pins read
            # `src/pokezero/engine_world.py` and `scripts/engine_transition_differential.py`
            # by AST, and both are already listed above, so a new refusal reason or a new
            # `classify_divergence` return site trips this workflow. The pin file and its
            # two counterexample artifacts are listed for the same reason
            # `test_boundary_verdict_partition.py` is: a PR whose only change weakens the
            # census, or deletes the c32/c43 witnesses the matchers are pinned against,
            # must not be able to go green without running it.
            tests/test_never_fired_counter_census.py
            reports/c32_fail_diagnosis.json
            reports/c43_coverage_shortfall_diagnosis.json
            # ⚠ C152's THIRTEEN artifacts were never listed here, and that is a live gap
            # rather than a tidy-up. They are members of the exact-count pins in BOTH
            # `tests/test_boundary_verdict_partition.py` (103) and
            # `tests/test_never_fired_counter_census.py` (401), and `mass-gate` is the only
            # job that runs either -- so a PR whose only change is deleting one of them
            # matches no filter, skips this job entirely and goes green. `seed-registry`
            # cannot cover it: the wide-census shards sit below `FIDELITY_SEED_FLOOR` and
            # that module does not see them at all. This is the exact failure mode the
            # C147 block above is annotated against, one revision later, in the PR that
            # added the standing rule about instruments.
            reports/artifacts/c152_*.json
            # C153's wide-seed negative census: the instrument behind §8's "a negative
            # measured only inside the two permitted windows is a claim about those
            # windows". Its twelve sweep shards are corpus members of the same two exact
            # counts, and its derived census artifact plus generator plus pin are listed
            # for the reason every pin file here is listed -- a PR whose only change
            # weakens or deletes one of them must not be able to go green without running
            # this job.
            reports/artifacts/c153_*.json
            scripts/c153_wide_negative_census.py
            tests/test_wide_seed_negative_census.py
            # C154's re-adjudication of section 4's 26 UNREACHABLE verdicts. Listed for the
            # reason every pin file and artifact above is listed: `mass-gate` is the only
            # job that runs the pin, so without these three lines a PR whose only change is
            # deleting the artifact, the generator or the pin matches no filter, skips this
            # job entirely and goes green.
            #
            # ⚠ This comment previously said the artifact "is NOT a member of the two
            # exact-count corpora (it sits under tests/data/ on purpose)". That was true of
            # a placement made on a hazard nobody had measured, and review measured it
            # false: in `reports/artifacts/` the never-fired census reports `Ran 22 tests
            # ... OK` on it, because its reason names appear only in prose, which that
            # census's matcher excludes in terms. The artifact IS a corpus member now
            # (401 -> 402), so its deletion is caught twice -- here and by the exact count.
            # The comment is corrected rather than deleted: it is the record of why the
            # file moved.
            reports/artifacts/c154_unreachable_readjudication.json
            scripts/c154_unreachable_readjudication.py
            tests/test_unreachable_readjudication.py
            # ⚠ THE LEDGER ITSELF AND ITS UNIFORMITY PIN MATCHED NOTHING across all 74
            # patterns above, and `mass-gate` is the only job that runs the uniformity
            # step. That module holds an EXACT §3 row inventory and, as of C153, the
            # header sentence's row count too -- so a PR whose only change is deleting a
            # gap row from `reports/c138_known_gaps_ledger.md` matched no filter, skipped
            # this job and went green. Found by widening C153's own path-filter audit
            # after it had already caught the C152 block above and stopped one file short
            # of the file it was itself editing. `reports/c150_...` is the same class: an
            # artifact a permanent ledger cell cites, with no filter entry.
            reports/c138_known_gaps_ledger.md
            tests/test_ledger_table_uniformity.py
            reports/artifacts/c150_band_split_trade_census.json
            # C155's terminal-disposition register and its pin. Listed for the reason every
            # pin file and document above is listed: `mass-gate` is the only job that runs
            # the pin, so without these two lines a PR whose only change is deleting or
            # editing the register matches no filter, skips this job and goes green. The
            # register is the document an owner reads to decide whether
            # `RATIFIED_SWEEP_PRECONDITION` holds, which makes an unrun pin on it the
            # single worst place in this file for the gap the C152 block above records.
            reports/c155_terminal_disposition_register.md
            tests/test_terminal_disposition_register.py
            # The Transform forme-ident battery. `src/pokezero/**` already triggers this
            # job, so the FIX is covered; this line covers the pin itself, for the reason
            # every entry above is listed -- a PR whose only change is deleting the module
            # matches no other filter, skips `mass-gate` (the only job that runs it) and
            # goes green.
            tests/test_transform_forme_ident.py
            # The coverage-bound pins' ENTIRE input. Without these listed, a PR whose
            # only change is deleting one of them skips mass-gate and goes green.
            reports/artifacts/c131_leechseed_main_dev_sweep.json
            reports/artifacts/c131_leechseed_main_holdout_sweep.json
            reports/artifacts/c131_leechseed_fix_dev_sweep.json
            reports/artifacts/c131_leechseed_fix_holdout_sweep.json
            # C147's EIGHT G33b sweeps -- a pre-merge base/gate pair and a merged one, both
            # retained. Listed for the same reason as the c131 four
            # above: they are corpus members of the exact-count pin in
            # tests/test_boundary_verdict_partition.py, so a PR whose only change is
            # deleting one of them must trip this workflow rather than skip it.
            reports/artifacts/c147_g33b_base_dev_sweep.json
            reports/artifacts/c147_g33b_base_holdout_sweep.json
            reports/artifacts/c147_g33b_gate_dev_sweep.json
            reports/artifacts/c147_g33b_gate_holdout_sweep.json
            reports/artifacts/c147_g33b_merged_base_dev_sweep.json
            reports/artifacts/c147_g33b_merged_base_holdout_sweep.json
            reports/artifacts/c147_g33b_merged_gate_dev_sweep.json
            reports/artifacts/c147_g33b_merged_gate_holdout_sweep.json
            # The remaining five C147 artifacts -- two row replays, two merged row replays
            # and the reach census -- are outside the sweep corpus but INSIDE the
            # never-fired counter corpus (360), whose count is equally exact. One glob
            # rather than five lines, and it also covers the eight named above.
            reports/artifacts/c147_g33b_*.json
            src/pokezero/**
            # C145: the Encore-on-transform pins, which are what hold `19100170/71-72`
            # closed. Listed so a PR that ONLY weakens the pin file still trips this
            # workflow -- and note the file was previously run by no step at all.
            tests/test_engine_world_encore_transform.py
            # Q2: the NON-transformed Encore branch's third id source (the public
            # `lastUsedMove` latch), with a STEP below. Same reason as the line above,
            # and the same hole it was closing: before its step existed the file would
            # have been run by NO workflow, because CI names modules one by one and
            # never discovers `tests/`.
            tests/test_engine_world_encore_last_used.py
            # C153: the Taunt volatile pins, with a STEP below. Same reason as the
            # line above -- `src/pokezero/**` covers `engine_world.py`, not the file
            # that holds the counter's value and the engine-fidelity half.
            tests/test_engine_world_taunt.py
            # The engine-search telemetry pins, with a STEP below. Listed for the reason
            # every other test file here is: a PR whose only change weakens these pins --
            # deleting the abort-path tests, or the cross-language attribute-name pin that
            # is the sole guard against the Rust and Python spellings drifting -- must still
            # trip the gate. `src/pokezero/**` covers the module they pin but not the pins.
            tests/test_engine_search.py
            # Direction 2 of the oracle, with a STEP below. Same reason as every
            # other test file here: `src/pokezero/**` covers `public_projection.py`
            # but not the pins on it, and a PR whose only change widens the render
            # HP band's pins or drops the plain-poison fixture must still trip the
            # gate. #1215 shipped this file with no entry and no step at all.
            tests/test_public_projection.py
            tests/test_sleep_talk_phaze_drag.py
            tests/test_instruction_event_mapping.py
            # This PR pins `Ran 8 tests` on crit-kill-split, so its own edits must trigger.
            tests/test_crit_kill_split_patch.py
            # C138's enumeration oracle: the fixtures and the shipping-engine
            # comparison, the module that builds both, and the PINNED enumerated
            # truth. All three are listed. The artifact especially: a PR whose only
            # change is regenerating it is exactly the shape its own README warns
            # against ("NEVER regenerate it from the shipping build to make a test
            # pass"), and without this entry that PR would skip the gate.
            tests/test_collapsed_arm_mass_oracle.py
            scripts/collapsed_arm_mass_oracle.py
            tests/data/collapsed_arm_mass_oracle.json
            tests/test_drag_limit_is_a_last_resort.py
            # Imported by the differential (engine_transition_differential.py:105).
            scripts/fidelity_gate_events.py
            tests/test_poke_engine_patch_stack.py
            # A5 lives here. Without this entry the patch that fixes it triggers the
            # workflow (via the .patch and patches.txt globs) but the suite holding its
            # pins is not even a trigger, let alone a step.
            tests/test_engine_gen3_abilities.py
            # Pins `Ran 6 tests` and a no-skip guard on the pyo3 binding boundary.
            # Omitting it is self-defeating: a PR that adds a skipIf or drops the
            # nonzero assertion touches only this file, so the gate that would
            # catch it never runs. Found by review of #1108.
            tests/test_rest_sleep_refund_boundary.py
            # Pins the harness write side: the double-count guard and the
            # capability probe's negative control. Same reason as the line above --
            # a PR that weakens only this file must still trigger the gate.
            tests/test_rest_sleep_refund_write_side.py
            # Holds test_member_coverage_is_locked_to_the_pokemon_spec_surface, an
            # AUTOMATIC guard that every PokemonSpec field appears in the transport
            # attestation. It caught rest_sleep_pending_refund the moment the field
            # was added -- and nobody saw it, because this module was in no
            # workflow's FILTERS and no step. A guard nothing runs. Found by review
            # of #1113.
            tests/test_engine_stat_attestation.py
            # The denominator rule and the four harnesses that adopt it. Without these a PR
            # that guts differential_denominator.py -- or moves an `attempted` counter back
            # above a skip decision, which is exactly the bug review caught in #1154 --
            # triggers no workflow at all. Added with a STEP below rather than filters alone,
            # because a filter with no step is the "guard nothing runs" this file already
            # documents twice.
            scripts/differential_denominator.py
            scripts/leaf_vs_reality.py
            scripts/leaf_root_parity.py
            scripts/prior_mapping_assert.py
            scripts/fidelity_gate_events.py
            tests/test_differential_denominator.py
            tests/test_denominator_adoption.py
            # The spread-gate provenance pin. Listed with a STEP below, and the step is
            # honest that it cannot execute the assertions: the pin needs a pokemon-showdown
            # checkout, CI builds none, and the default root is outside the repo and
            # untracked -- so 5 of the 6 skip here; only the fixture lint executes. Without this entry a PR that DELETES the pin
            # trips no workflow at all, which is the failure mode this file forbids twice and
            # which this very pin was subject to for 37 commits after #1123.
            tests/test_spread_gate_provenance.py
            tests/_showdown_root.py
            # The leaf self-recharge derivation pin. Review found the P3 freeze lift pinned by
            # NOTHING -- reverting it at the binary level left 146/146 green, because the only
            # things that caught it were the two corpus-driven harnesses, and the corpus is
            # gitignored. This test needs no CORPUS but does need a Showdown checkout for the
            # dex, so like the spread-gate pin above it SKIPS here; the step below pins that
            # skip count so the file cannot shrink unnoticed. Listing a filter with no step is
            # the "guard nothing runs" pattern this file names twice, and a first version of
            # this entry did exactly that.
            tests/test_leaf_self_recharge_derivation.py
            tests/test_leaf_encoder.py
            # C116 Phase 2's scope gate. Listed for the same reason as the entries
            # above: a PR whose only change is adding a file to the mention ledger,
            # widening _IMPORT_PROBE_EXCLUSIONS, or deleting the collapsed-fan pin
            # touches nothing else -- so without this line the gate that would object
            # is not even a trigger.
            tests/test_roll_enumeration_scope.py
            .github/workflows/engine-fidelity-gates.yml
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail CLOSED: if the diff cannot be computed, run the gates.
          # THREE dots: diff from the merge base, which is what GitHub's own
          # `paths:` filter and the Files-changed view use. A two-dot diff against
          # the base-branch TIP normally over-matches (harmless), but if an
          # identical change also landed on main the trees agree, the file drops
          # out, and a touched path silently stops matching.
          #
          # --no-renames: with rename detection on (the default), `git mv
          # src/pokezero/x.py lib/` reports ONLY the destination, so moving a file
          # OUT of a gated directory would match nothing and skip the gates on a
          # change certain to break them.
          # core.quotePath=false: git otherwise C-quotes non-ASCII paths, emitting
          # `"src/pokezero/caf\303\251.py"` -- with literal quotes -- which then
          # matches no glob. That is the ONE direction in which this filter is
          # narrower than GitHub's `paths:` rather than wider, i.e. the only
          # fail-OPEN divergence. No non-ASCII path exists in the tree today; this
          # keeps it that way by construction rather than by luck.
          if ! changed=$(git -c core.quotePath=false diff --no-renames --name-only "$BASE...$HEAD"); then
            echo "could not diff $BASE..$HEAD; running the gates anyway"
            echo "fidelity=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          matched=false
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            # The old trigger `paths:` list carried a one-line rationale per entry
            # ("Found by review of #1081", "A5 lives here", ...). A YAML block
            # scalar cannot hold YAML comments, so they live inside it and are
            # skipped here -- deleting the provenance of each glob was not worth
            # the tidiness.
            case "$pattern" in \#*) continue ;; esac
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              # shellcheck disable=SC2254
              case "$file" in
                $pattern) matched=true ;;
              esac
            done <<< "$changed"
          done <<< "$FILTERS"
          echo "fidelity=$matched" >> "$GITHUB_OUTPUT"
          echo "fidelity paths touched: $matched"
  mass-gate:
    needs: changes
    if: needs.changes.outputs.fidelity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # uv is REQUIRED, not optional: scripts/vendor_poke_engine_src.sh and
      # scripts/setup_poke_engine.sh call `uv run ... pip download` and `uv pip
      # install` with no fallback, and uv is not on the ubuntu runner image. Without
      # it the build dies at step [1/8] with exit 127 on every run -- and, worse, the
      # patch-stack tamper guard SKIPS rather than fails (see below). Found by review
      # of #1080.
      - uses: astral-sh/setup-uv@v6

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/pokezero-search

      - name: Install build tooling
        # numpy is explicit rather than implied. It is an OPTIONAL dependency (the `neural`
        # extra in pyproject.toml), but three of the four differential harnesses --
        # leaf_vs_reality.py, leaf_root_parity.py and prior_mapping_assert.py -- `import numpy`
        # at module level. Without it they cannot be IMPORTED here at all, so the denominator
        # step's acceptance subtests errored for three of four harnesses on this step's first
        # real CI run. Installing the extra itself would drag in torch for nothing; numpy alone
        # is what the harnesses actually need.
        run: python -m pip install -e . maturin numpy

      # The patch stack must apply at fuzz 0 and hash to its pins before anything is
      # built. This is also the tamper guard: PATCHED_TARGET_TREE_SHA256 rejects a
      # zero-context hunk that applied in the wrong place.
      # tests/test_poke_engine_patch_stack.py calls self.skipTest when `uv` is absent,
      # and that skip covers EXPECTED_FINAL_SHA256 and PATCHED_TARGET_TREE_SHA256 --
      # the tamper guard this step exists for. unittest then exits 0 and the step goes
      # green having asserted nothing. The uv install above is what makes this real;
      # the skip assertion below is what keeps it real.
      - name: Patch stack integrity
        run: |
          set -o pipefail
          python -m unittest tests.test_poke_engine_patch_stack -v 2>&1 | tee /tmp/patchstack.log
          # A count assertion as well as a skip assertion. grep-for-'skipped'
          # cannot notice a DELETED test: removing three of four leaves the step
          # green, which is the "reads PASS while asserting less than intended"
          # shape this workflow's header forbids. Found by review of #1081.
          if ! grep -qE 'Ran 4 tests' /tmp/patchstack.log; then
            echo "::error::expected 4 tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/patchstack.log; then
            echo "::error::a patch-stack test SKIPPED; the tamper guard did not run"
            exit 1
          fi

      - name: Build and install the gen3 engine and the search crate
        run: bash scripts/build_search_crate_engine.sh

      # Direction 2 of the oracle. #1215 shipped this module and no job ran it,
      # which is report 4 section 4.7's named hazard verbatim: a new test module is
      # invisible here by default because the workflow names modules one at a time,
      # and a gate no job runs is not a gate. It went a whole PR unenforced, and
      # the follow-up that found the module header still asserting two retracted
      # coverage claims found them in a file CI never loaded.
      # Exact count, not a floor: this module's pins are the band width of the HP
      # comparator and the two units of the render arm, and both are the kind of
      # thing a silently-shrinking suite stops noticing.
      - name: Public projection oracle (direction 2)
        run: |
          set -o pipefail
          python -m unittest tests.test_public_projection -v 2>&1 \
            | tee /tmp/pubproj.log
          if ! grep -qE 'Ran 114 tests' /tmp/pubproj.log; then
            echo "::error::expected 114 public-projection pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. RenderBandWidthTests is the only thing pinning
          # the HP band, which is the dominant determinant of the largest figure the
          # render arm publishes, and a skipIf on it would turn that figure back
          # into an unverified one.
          if ! grep -qE '^OK$' /tmp/pubproj.log; then
            echo "::error::public-projection pins did not report a clean OK"
            exit 1
          fi

      # Behaviour is the only thing a stale .so cannot fake: --check validates the
      # patch set against the stamp, but a restamp without a rebuild leaves a stale
      # wheel that --check calls current. This has bitten twice.
      # Redundant with the build script, which runs the probes at [7/8] and the stamp
      # at [6/8] -- so the build step fails on a probe failure BEFORE reaching here.
      # Kept as named steps anyway: when the build fails, "Behavioural probes" in the
      # step list tells the next reader which instrument objected. The PR body's claim
      # that "each step can fail only for its own reason" was inaccurate and is
      # withdrawn.
      - name: Behavioural probes
        run: python scripts/engine_behavioral_probes.py

      # The instrument this workflow exists for. Compares branch masses against an
      # integer reconstruction that shares none of the partition logic.
      - name: Mass gate
        run: |
          set -o pipefail
          python -m unittest tests.test_branch_mass_reconstruction -v 2>&1 | tee /tmp/massgate.log
          # A count assertion as well as a skip assertion. grep-for-'skipped'
          # cannot notice a DELETED test: removing three of four leaves the step
          # green, which is the "reads PASS while asserting less than intended"
          # shape this workflow's header forbids. Found by review of #1081.
          # 6 -> 14: C119 obligation 1 / c137 section 4's four owed families landed
          # as OWED_CASES with eight methods of their own (seven, plus the Rain Dish
          # waiver pin added in review). The two matrices are counted together
          # because they are one module and one gate; the per-matrix guards that CI
          # cannot see are test_the_fixture_matrix_is_the_expected_size (9) and
          # test_the_owed_matrix_is_the_expected_size (7).
          if ! grep -qE 'Ran 14 tests' /tmp/massgate.log; then
            echo "::error::expected 14 tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/massgate.log; then
            echo "::error::the mass gate SKIPPED; it must never skip"
            exit 1
          fi

      # C138. The mass gate above compares ONE scalar -- total KO mass -- against a
      # reconstruction that has no notion of a secondary, which is precisely the
      # axis cause A8 lives on. This compares the full outcome-mass functional,
      # mass per (defender faints?, defender's end status), against ENUMERATED
      # truth from the roll-enumeration build, cross-checked against an independent
      # Python enumeration so a wrong oracle cannot bless a wrong recipe.
      - name: Collapsed-arm mass oracle
        run: |
          set -o pipefail
          python -m unittest tests.test_collapsed_arm_mass_oracle -v 2>&1 \
            | tee /tmp/armoracle.log
          if ! grep -qE 'Ran 7 tests' /tmp/armoracle.log; then
            echo "::error::expected 7 oracle tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/armoracle.log; then
            echo "::error::the collapsed-arm mass oracle SKIPPED; it must never skip"
            exit 1
          fi

      # C116 Phase 2. Roll enumeration is a flag-gated reference ORACLE consumed by
      # tests; NOTHING that ships takes that path, the transition differential very
      # much included. Two costs if that slips: enumeration measured 2.38 ms -> 8.88 s
      # per midgame_3v3 decision at depth 4 / 1024 sims, and a differential running
      # enumerated certifies a code path production never takes, which silently blinds
      # the 200-game fidelity gate to the surface that actually ships.
      #
      # The gate is BEHAVIOURAL, after review defeated the textual version: a file
      # containing only `import engine_transition_differential` mentioned no flag,
      # matched no allowlist, and enabled enumeration process-wide (and in every child)
      # while the scan stayed green. Each check now spawns a child, imports a surface
      # into it, and requires the engine's fan back COLLAPSED at [112, 160]. The flag is
      # latched per process by a OnceLock, so an in-process toggle would measure
      # whichever path happened to be latched first.
      #
      # The surface list is DISCOVERED, not hardcoded. A second review pass showed the
      # hardcoded five-tuple left 22 of 37 engine-touching modules outside every probe --
      # including src/pokezero/engine_env.py, which runs pokezero_search.env_step and is
      # reached by the pokezero-rollout console script. With an enabler there a real
      # search process came back ENUMERATED and this step still read `Ran 14 tests OK`.
      - name: Roll-enumeration scope gate
        run: |
          set -o pipefail
          python -m unittest tests.test_roll_enumeration_scope -v 2>&1 | tee /tmp/enumscope.log
          if ! grep -qE 'Ran 17 tests' /tmp/enumscope.log; then
            echo "::error::expected 17 tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/enumscope.log; then
            echo "::error::the scope gate SKIPPED; it must never skip"
            exit 1
          fi

      # A5: the contact secondary vs. the attacker's same-turn wake. These two pins
      # were RED at 0 against 33.3333 / 8.3333 / 6.6667 before the patch. They are
      # named individually rather than run as a module because AbilityCatalogTests
      # in the same file needs a built Showdown checkout and legitimately SKIPS in
      # CI -- a module-wide "must not skip" assertion would be a false gate, and a
      # module-wide count would go green on a skip. Deleting either pin makes the
      # unittest invocation itself fail to resolve, which is the point.
      - name: Contact-ability wake-ordering pins
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_engine_gen3_abilities.AbilityMechanicsTests.test_contact_secondary_sees_the_attacker_wake_on_the_same_turn \
            tests.test_engine_gen3_abilities.AbilityMechanicsTests.test_a_status_that_survives_the_move_still_refuses_the_contact_secondary \
            2>&1 | tee /tmp/a5pins.log
          if ! grep -qE 'Ran 2 tests' /tmp/a5pins.log; then
            echo "::error::expected 2 A5 pins; the set shrank or grew"
            exit 1
          fi
          # Without this, "OK (skipped=2)" reads as a pass. It did, locally, against
          # a venv with no wheel -- the pins asserted nothing and looked green.
          if grep -q 'skipped' /tmp/a5pins.log; then
            echo "::error::the A5 pins SKIPPED; they must never skip"
            exit 1
          fi

      # The ENGINE's own suite. Nothing ran it before this step: the only cargo
      # test in any workflow targets rust/pokezero-search, so every test in
      # third_party/poke-engine-src/tests/ was a pin nothing executed -- the
      # defect this workflow's header forbids, and the same one that let the
      # #1105 wheel break reach CI. The gen3 Rest-refund tests added alongside
      # this step are worthless without it. Runs after the build, which is what
      # materialises the patched source tree.
      - name: Engine gen3 suite
        run: |
          set -o pipefail
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml \
            --no-default-features --features gen3 --test test_gen3 2>&1 \
            | tee /tmp/gen3suite.log
          if ! grep -qE '^test result: ok\. 32 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' \
              /tmp/gen3suite.log; then
            echo "::error::expected 32 gen3 engine tests to pass; the suite shrank, grew, or failed"
            exit 1
          fi
          # And NAME the pins. A total can be restored by unrelated tests, which
          # is the defect the crate step below calls out; a count alone would let
          # the Rest-refund tests be deleted and replaced with any six others.
          # Each of these has a killed mutant behind it.
          for pin in \
            test_rest_refund_is_credited_on_switch_in \
            test_rest_refund_is_clamped_to_the_legal_maximum \
            test_rest_refund_is_credited_before_spikes_damage \
            test_ordinary_sleep_never_receives_a_rest_refund \
            test_switch_in_of_a_healthy_mon_emits_nothing \
            test_natural_wake_voids_a_pending_rest_refund \
            test_early_bird_wake_voids_a_pending_rest_refund \
            test_a_cured_sleep_voids_a_pending_rest_refund \
            test_a_non_sleep_usable_attempt_discards_the_refund \
            test_a_sleep_usable_attempt_banks_a_turn \
            test_using_rest_again_discards_the_previous_stints_refund \
            test_a_non_rest_sleeper_with_a_stale_bank_is_not_credited \
            test_early_bird_staying_asleep_discards_the_refund \
            immobilization_marker_apply_then_reverse_is_bit_identical \
            immobilization_marker_apply_alone_does_not_change_the_state \
            immobilization_markers_are_distinguishable_from_each_other_and_from_nothing \
            both_gen3_immobilizers_mark_their_branch_with_their_own_reason; do
            grep -qxE "test $pin \.\.\. ok" /tmp/gen3suite.log || {
              echo "::error::gen3 pin did not run: $pin"
              exit 1
            }
          done

      # The engine's --lib target: the `#[cfg(test)] mod`s inside
      # third_party/poke-engine-src/src/. `--test test_gen3` above selects ONE
      # integration target and compiles nothing under src/, so the FIVE unit tests
      # there ran in no workflow at all -- `state.rs`'s
      # `rest_sleep_pending_refund_tests` (four, added by #1105 alongside the step
      # above) and `instruction.rs`'s `test_instruction_size`. That is the same defect
      # the step above is named for, one cargo TARGET down instead of one crate down.
      #
      # Found by review of #1166. The three immobilizer-marker tests were MOVED out of
      # `src/state.rs` into `tests/test_gen3.rs` so the step above would run them,
      # which fixes those three and leaves the hole. This closes the hole.
      # `test_instruction_size` is the one that matters most for that patch: it is the
      # only assertion anywhere on `size_of::<Instruction>()`, and a new variant is
      # exactly what moves it.
      #
      # PROVEN RED BY CONSTRUCTION, not by reading this file. The body below was
      # extracted verbatim from this YAML and run against a live patched tree:
      #   * unmutated -> exit 0 at 5/5.
      #   * `rest_sleep_pending_refund_tests` deleted -> exit 1 (count 1). Caught ONLY
      #     here: `--test test_gen3` stays 32/32 green and the crate suite stays green
      #     above its floor, so before this step those four pins were deletable with
      #     every gate green.
      #   * one pin renamed, count still 5 -> exit 1 on the named-pin arm.
      - name: Engine lib suite
        run: |
          set -o pipefail
          cargo test --manifest-path third_party/poke-engine-src/Cargo.toml \
            --no-default-features --features gen3 --lib 2>&1 \
            | tee /tmp/gen3lib.log
          if ! grep -qE '^test result: ok\. 5 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out' \
              /tmp/gen3lib.log; then
            echo "::error::expected 5 engine lib tests to pass; the suite shrank, grew, or failed"
            exit 1
          fi
          # And NAME them, for the reason the step above gives: a total can be
          # restored by unrelated tests. Both arms measured red by construction.
          for pin in \
            instruction::test::test_instruction_size \
            state::rest_sleep_pending_refund_tests::apply_then_reverse_is_bit_identical \
            state::rest_sleep_pending_refund_tests::refund_round_trips_without_a_pre_transform \
            state::rest_sleep_pending_refund_tests::zero_refund_is_omitted_from_serialization \
            state::rest_sleep_pending_refund_tests::a_pre_field_serialization_still_parses; do
            grep -qxE "test $pin \.\.\. ok" /tmp/gen3lib.log || {
              echo "::error::engine lib pin did not run: $pin"
              exit 1
            }
          done

      # The pyo3 boundary is a blind spot that already cost one red-CI cycle on
      # #1105: adding a field to the engine's Pokemon broke the wheel build, and
      # nothing local caught it because `cargo test -p pokezero-search` never
      # compiles poke-engine-py. Compiling is necessary but NOT sufficient --
      # `impl Into<Pokemon>` keeps compiling while hardcoding a value, which is a
      # silent wrong answer on the exact path production uses to build state
      # (poke_engine_adapter.py: engine.State(...)). Only a nonzero assertion
      # distinguishes "carried" from "hardcoded"; verified by reintroducing the
      # literal 0, which fails 2 of these 5.
      - name: Engine binding boundary pins
        run: |
          set -o pipefail
          python -m unittest tests.test_rest_sleep_refund_boundary -v 2>&1 \
            | tee /tmp/boundary.log
          if ! grep -qE 'Ran 6 tests' /tmp/boundary.log; then
            echo "::error::expected 6 boundary pins; the suite shrank or grew"
            exit 1
          fi
          # The module imports poke_engine at top level precisely so a missing
          # wheel is an ERROR, not a skip. Assert it anyway: a future edit that
          # adds skipIf would otherwise quietly disarm the whole file.
          if grep -q 'skipped' /tmp/boundary.log; then
            echo "::error::a binding boundary pin SKIPPED"
            exit 1
          fi

      - name: Denominator rule
        run: |
          set -o pipefail
          python -m unittest tests.test_differential_denominator \
            tests.test_denominator_adoption -v 2>&1 | tee /tmp/denominator.log
          # CI does NOT execute the real-driver acceptance -- it needs corpus/golden-v4,
          # which is gitignored, so it skips here. That is the layer which caught the
          # round-1 bug in #1154, and it runs only on a developer machine. Said plainly
          # rather than as reassurance.
          #
          # The skip COUNT is pinned as well as the ran-count, for the reason the
          # "Engine binding boundary pins" step above gives: a future `skipIf` would
          # otherwise keep `Ran N` green while disarming the acceptance entirely -- the
          # "guard nothing runs" pattern this file already documents twice, and the very
          # reason this step exists.
          if ! grep -qE 'Ran 31 tests' /tmp/denominator.log; then
            echo "::error::denominator pins changed count; the suite shrank or grew"
            exit 1
          fi
          if ! grep -qE 'OK \(skipped=6\)' /tmp/denominator.log; then
            echo "::error::denominator skip set changed; expected exactly the 6 corpus-dependent tests"
            exit 1
          fi

      # The reserved final holdout. Seeds >= 19,200,000 are for exactly ONE
      # measurement, ever, and that reservation used to live only in a plan
      # document -- until a convenience shell loop over three --seed-start values
      # executed 60 games of it. The guard refuses such runs; these pins keep the
      # guard honest, so they have to actually run.
      #
      # NOTE ON SKIPS, learned the hard way. The first version of this step said
      # "this job builds Showdown" and errored on any skip. CI builds no Showdown --
      # no workflow installs node, none is tracked, and two steps in this same job
      # say so outright -- so the ordering pin skipped and this step went RED on
      # every PR that tripped the filter. A permanently-red gate discriminates
      # nothing: the only way back to green is to delete the step, which is the
      # failure mode the guard exists to prevent, one level up. The ordering pin now
      # stubs its collaborators and needs no checkout, so the no-skip assertion
      # below is meaningful rather than self-defeating.
      - name: Spread-gate provenance pin (shape only -- CANNOT run here)
        run: |
          set -o pipefail
          python -m unittest tests.test_spread_gate_provenance -v 2>&1 | tee /tmp/spreadgate.log
          # READ THIS BEFORE TRUSTING A GREEN. Five of the six tests are SKIPPED in CI; only the
          # fixture lint executes. The two-way provenance assertions do NOT run here.
          # The pin drives a real randbats set source, CI builds no Showdown (two steps in this
          # job say so), and the default root is outside the repo and untracked. So this step
          # verifies SHAPE for five of them -- that the pin still exists, still has 6 tests, and
          # still skips for the stated reason rather than silently shrinking -- plus ONE real
          # assertion: the fixture lint was moved out of the skip-gated class so CI executes
          # something. Review measured why that mattered: gut all 18 assertions while keeping 6
          # tests and a shape-only step still passes.
          #
          # That is worth a step anyway. Between #1123 and this commit the file was in no
          # filter and no step, so deleting it outright would have tripped nothing -- the
          # "guard nothing runs" pattern this workflow's header forbids, applied to the guard
          # that pins checkpoint provenance in both directions. The assertions are exercised on
          # a developer machine with POKEZERO_SHOWDOWN_ROOT set; see reports/ for the red runs.
          if ! grep -qE 'Ran 6 tests' /tmp/spreadgate.log; then
            echo "::error::spread-gate pin changed count; the two-way provenance test shrank or grew"
            exit 1
          fi
          if ! grep -qE 'OK \(skipped=5\)' /tmp/spreadgate.log; then
            echo "::error::expected exactly 5 skips (the fixture lint must RUN, the other five must not); if all 6 skipped, the lint regained a Showdown dependency"
            exit 1
          fi

      - name: Leaf self-recharge derivation pin (shape only -- CANNOT run here)
        run: |
          set -o pipefail
          python -m unittest tests.test_leaf_self_recharge_derivation -v 2>&1 | tee /tmp/leafrecharge.log
          # Skips in CI: _pair() needs a Showdown checkout for the dex. Shape only, same
          # bargain as the spread-gate step above and disclosed for the same reason.
          # It is worth a step because the thing it pins -- leaf.rs deriving our own
          # MUSTRECHARGE rather than passing the root's -- was pinned by NOTHING until this
          # PR: reverting it at the binary level left 146/146 Python tests green.
          if ! grep -qE 'Ran 4 tests' /tmp/leafrecharge.log; then
            echo "::error::leaf self-recharge pin changed count; the derivation pin shrank or grew"
            exit 1
          fi
          if ! grep -qE 'OK \(skipped=4\)' /tmp/leafrecharge.log; then
            echo "::error::expected all 4 to skip here; if they RAN, CI gained a Showdown checkout and this disclaimer is wrong"
            exit 1
          fi

      - name: Final-holdout guard pins
        run: |
          set -o pipefail
          python -m unittest tests.test_final_holdout_guard -v 2>&1 \
            | tee /tmp/holdout.log
          # 14 -> 25 (C151): `TheBurnedBlockAndTheOwnerRatificationTests`. Eleven pins for
          # the two properties this file did not previously have -- that
          # `19,200,000`-`19,200,259` is BURNED and no opt-in reopens it, and that
          # `OWNER_RATIFIED` carries the window and the owner's name so a blessing is a
          # reviewable diff rather than a sentence in a document an agent can walk past.
          # 24 -> 25 on review: the AGGREGATION refusal's rationale was pinned nowhere, so
          # rewriting it down to "reserved" left both suites green while the execution
          # message's rationale was pinned three ways.
          if ! grep -qE 'Ran 25 tests' /tmp/holdout.log; then
            echo "::error::expected 25 final-holdout pins; the suite shrank or grew"
            exit 1
          fi
          # No pin may skip. Every one runs without a Showdown checkout by
          # construction, so a skip means someone reintroduced an environmental
          # dependency and disarmed a pin.
          #
          # Assert on a BARE `OK` rather than grepping for 'skipped'. The step's own
          # log already contains "engine build-freshness check SKIPPED" twice, so the
          # lowercase grep passed only by letter case -- one character from
          # reintroducing the red-gate incident above. `^OK$` is strictly stronger:
          # unittest prints `OK (skipped=N)` when anything skips.
          if ! grep -qE '^OK$' /tmp/holdout.log; then
            echo "::error::final-holdout pins did not report a clean OK (skip or failure)"
            exit 1
          fi

      # The differential measures ~87% of boundaries, not the ~96.6% its own
      # `measured_fraction_of_full_rounds` reports: that metric's denominator is
      # `boundaries_full_round`, which by construction EXCLUDES single-seat plies
      # (~10% of boundaries, and almost all of the deferred-residual population --
      # all of it except a simultaneous double faint). These pins keep the real
      # denominator recoverable from any report, so a residue figure cannot be read
      # as full coverage. reports/c132.
      - name: Single-seat coverage bound
        run: |
          set -o pipefail
          python -m unittest tests.test_single_seat_coverage_bound -v 2>&1 \
            | tee /tmp/coverage.log
          if ! grep -qE 'Ran 3 tests' /tmp/coverage.log; then
            echo "::error::expected 3 coverage-bound pins; the suite shrank or grew"
            exit 1
          fi
          if ! grep -qE '^OK$' /tmp/coverage.log; then
            echo "::error::coverage-bound pins did not report a clean OK"
            exit 1
          fi

      # The VERDICT partition, which is a different partition from the coverage one
      # above and was asserted with the wrong number of terms for the whole
      # C111-C141 era: `matched + diverged == boundaries_measured` is FALSE, because
      # `engine_error` and `skip:strict_all_branches_lossy` are both counted after
      # `boundaries_measured` has already incremented. reports/c144.
      #
      # C142 makes it FIVE-term (`skip:rump_branch_set`) and takes the module 23 -> 26,
      # adding the two sufficiency pins for the membership rule and the artifact-shape
      # pin. The count below is EXACT for the same reason #1163 chose an exact count over
      # a floor: a floor was the one fail-open in its mutation battery. Note that this
      # guard lives in YAML, so no local `unittest` or `pytest` run can see it -- it is
      # invisible to the "run the suite and diff the failing set" check, which is how a
      # module that grew without its guard following reached an approved PR.
      - name: Boundary verdict partition
        run: |
          set -o pipefail
          python -m unittest tests.test_boundary_verdict_partition -v 2>&1 \
            | tee /tmp/verdict.log
          if ! grep -qE 'Ran 26 tests' /tmp/verdict.log; then
            echo "::error::expected 26 verdict-partition pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. The module's anti-vacuity pins -- that the
          # artifact corpus is non-empty, and that c26/c27 still REFUTE the two-term
          # form -- are the only reason the rest of it means anything, so a skipIf
          # added to either must be a red gate rather than a quieter green one.
          if ! grep -qE '^OK$' /tmp/verdict.log; then
            echo "::error::verdict-partition pins did not report a clean OK"
            exit 1
          fi

      # C146. The ledger has asserted a false "never fired" four times, and each error
      # propagated because citing the ledger felt like verification. This module computes
      # the fired/never-fired partition from every committed JSON under `reports/` and
      # `docs/` and asserts it as an exact SET EQUALITY in both directions, so a counter
      # that starts firing is red rather than a silent widening. Exact count, not a floor,
      # for the reason #1163 established. Battery: 10 mutations applied, 9 caught; the
      # tenth is the documented fail-open (a subset assertion carrying H15's wrong
      # six-class expectation passes), which is why the pin asserts equality.
      - name: Never-fired counter census
        run: |
          set -o pipefail
          python -m unittest tests.test_never_fired_counter_census -v 2>&1 \
            | tee /tmp/neverfired.log
          if ! grep -qE 'Ran 22 tests' /tmp/neverfired.log; then
            echo "::error::expected 22 never-fired census pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. The three matcher pins in
          # TheMatchersThemselvesAreExercisedTests are the only reason the absence pins
          # mean anything -- skipping one turns every absence assertion vacuous.
          if ! grep -qE '^OK$' /tmp/neverfired.log; then
            echo "::error::never-fired census pins did not report a clean OK"
            exit 1
          fi

      # C153. The census step above is the CORPUS instrument, and §8's newest standing
      # rule says in its own sentence that a corpus instrument cannot catch this class of
      # error: `strict:branch_event_legal_error:BranchLegalRollError` and
      # `skip:rump_branch_set` are 0 in every artifact committed before C152 and fire
      # immediately on unregistered seeds. The rule landed with no instrument. This step is
      # it -- a MEASUREMENT taken somewhere new, pinned as a fired/not-observed partition
      # over 10,000 games on unregistered seeds `1,001,000`-`1,010,999`, with the scope
      # written into every verdict. Its own module so the census above keeps its
      # `Ran 22 tests` guard untouched, per C150's precedent. Exact count, not a floor.
      - name: Wide-seed negative census
        run: |
          set -o pipefail
          python -m unittest tests.test_wide_seed_negative_census -v 2>&1 \
            | tee /tmp/widecensus.log
          if ! grep -qE 'Ran 36 tests' /tmp/widecensus.log; then
            echo "::error::expected 36 wide-seed census pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. TheAbsencePinsAreNotVacuousTests is the only reason
          # the fired/not-observed partition means anything -- every absence in it is a
          # loop over the same twelve shards, and a loop over a shard set that stopped
          # being read passes. Skipping it turns the whole module vacuous.
          if ! grep -qE '^OK$' /tmp/widecensus.log; then
            echo "::error::wide-seed census pins did not report a clean OK"
            exit 1
          fi

      # C154. Section 4's 26 UNREACHABLE verdicts, re-adjudicated against C153's rule
      # ("trace the raise site to the caller that actually reaches it"). The corpus census
      # and the wide-seed census cannot do this job -- section 4's rows are neither
      # counters nor sweeps -- so this is a third instrument, not a wider run of an
      # existing one. Its load-bearing property is that every citation in every
      # demonstration is RE-DERIVED from source on each run, which is what stops the 26
      # from ageing into the fifteen-stale-citations shape #1202 produced. Its own module
      # so the two censuses keep their exact-count guards untouched, per C150's precedent.
      # Battery: 35 mutations applied, 35 caught, listed in the module docstring -- number
      # 8 survived the first version, 13-23 are review's, each one a sentence of this
      # pass's own that was asserted beyond what it traced, and 24-35 are C156's. Exact
      # count, not a floor, and no longer a typed one: the module derives this number from
      # its own enumerated list and reads it back out of THIS comment.
      #
      # ⚠ This module also re-derives EVERY `Ran N tests` guard in this file from its
      # module's AST. That is not scope creep: bumping this step's own guard was done with
      # an unbounded string replace that also rewrote the FINAL-HOLDOUT step's guard --
      # which gates OWNER_RATIFIED, BURNED_FINAL_HOLDOUT and the burn -- to a count its
      # suite can never print, so it stopped failing closed and nothing noticed.
      #
      # ⚠ AND THE SCAN ITSELF WAS BLIND TO FOUR OF THIS FILE'S 26 EXECUTABLE STEPS until
      # C156 (#1205). It looked at most twelve lines past each invocation; the denominator
      # pair, the spread-gate pin, the stat attestation and the SEED REGISTRY put their
      # guard 12, 16, 30 and 23 lines out, behind comment blocks exactly like this one, and
      # the scan emitted no entry for them at all -- no error, no skip, absent. Setting the
      # seed-registry guard to a count its suite can never print left this module green.
      # Step extent is now derived from the `run:` body, and coverage is ASSERTED: an
      # executable step with no reachable guard reddens here.
      - name: Section 4 unreachable re-adjudication
        run: |
          set -o pipefail
          python -m unittest tests.test_unreachable_readjudication -v 2>&1 \
            | tee /tmp/c154readj.log
          if ! grep -qE 'Ran 38 tests' /tmp/c154readj.log; then
            echo "::error::expected 38 re-adjudication pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. TheAbsencePinsAreNotVacuousTests is the only reason
          # the 26 zeroes mean anything -- every one of them is a lookup into one dict
          # built from one file, and a census that read nothing would make all 26 rows
          # EASIER to assert. Skipping it turns the whole module vacuous.
          if ! grep -qE '^OK$' /tmp/c154readj.log; then
            echo "::error::re-adjudication pins did not report a clean OK"
            exit 1
          fi

      # C150. C116 item 14 requires a pool-reachability check recorded next to every
      # known-gaps entry, and the ledger records it in a COLUMN -- so a row that gains a
      # cell delimiter has that check DROPPED by GFM while it stays in the bytes. That
      # happened at `a587e614^`: G37 (20 pipes) and G37b (9) against a 6-pipe / 5-column
      # header both rendered with an EMPTY Reachability cell. #1166 fixed them and the file
      # has been clean at every commit since; what it did not leave was a control, and its
      # own note says so ("not pinned ... filed as a follow-up"). This step is that
      # follow-up, as its own module so the census above keeps its `Ran 22 tests` guard
      # untouched. Note the escape rule here is GFM's real one -- a pipe preceded by ANY
      # backslash is escaped, verified against cmarkgfm and GitHub's /markdown API -- after
      # a first revision of this module used a parity rule and falsely condemned two rows.
      # Battery: 9 mutations applied, 9 caught, listed in the module docstring. Exact count,
      # not a floor, for the reason #1163 established.
      - name: Ledger table uniformity
        run: |
          set -o pipefail
          python -m unittest tests.test_ledger_table_uniformity -v 2>&1 \
            | tee /tmp/ledgertables.log
          if ! grep -qE 'Ran 19 tests' /tmp/ledgertables.log; then
            echo "::error::expected 19 ledger-table pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. TheHistoricalDropIsCaughtTests feeds the checker the
          # pre-#1166 bytes of both dropped rows, and TheEscapeRuleMatchesRealRenderersTests
          # pins the delimiter rule itself; skipping either turns every uniformity
          # assertion into an unverified matcher.
          if ! grep -qE '^OK$' /tmp/ledgertables.log; then
            echo "::error::ledger table-uniformity pins did not report a clean OK"
            exit 1
          fi

      # C155. The terminal-disposition register. `RATIFIED_SWEEP_PRECONDITION` gates the
      # program's one terminal measurement on "the ledger is terminal AND the engine
      # fingerprint is declared frozen", and the list of what stands between here and that
      # had been RECONSTRUCTED three times by three agents with different numbering each
      # time. This step is what makes the committed version a maintained document rather
      # than a fourth reconstruction: the item inventory is exact and ORDERED (ids are
      # permanent, so a renumbering is red), the statuses are re-derived in BOTH directions
      # -- flipping an OPEN item to discharged manufactures terminality and flipping the
      # discharged one to OPEN manufactures openness, and both fail -- and every figure in
      # its Appendix A is re-derived from tracked bytes, committed artifacts and anchors
      # resolved with uniqueness required, imported from C153's census rather than copied.
      #
      # Battery: 53 mutations applied, 53 caught, plus
      # one NEGATIVE CONTROL verified green, listed in the module docstring -- a
      # MUTATION count, not the test count, which a first revision of this comment conflated
      # by writing the module's 34 tests here. SIXTEEN of the 53 are applied only to the tree
      # and never to the document, because a pin that reads a document against a hard-coded
      # copy of itself passes every document-side mutation; the first revision claimed ten
      # and two of those ten edited the register. Exact count, not a floor, per #1163.
      #
      # ⚠ #1205: the guard scan added in #1204 does not cover every guard here, so do not
      # assume it will catch a drift in this one. MEASURED, and the denominator is
      # EXECUTABLE sites -- one line in this file carrying the invocation is a comment and
      # is not a guard. Merged tree: 26 executable, 22 resolved, 4 unresolved; this step IS
      # one of the 22, deriving 42 from the module's AST. #1205's own "24 of 20" was exact
      # at 6ef682bf and its COUNTS are now stale -- main gained #1203's guarded Taunt step,
      # so main reads 25/21 -- while its FINDING, the same four unresolved steps, is not.
      # The register re-derives all three numbers rather than stating them, and pins the
      # unresolved SET by module name because that half does not churn.
      #
      # ⚠ THIS STEP FAILED IN CI WHILE GREEN ON TWO LOCAL TREES, and the reason is worth
      # carrying: GitHub gates on refs/pull/<n>/merge. #1203 added an invocation to main
      # after this branch was cut and this branch added its own -- each tree reads 25, the
      # merge reads 26. A PR touching this file must merge origin/main (never rebase) and
      # re-derive. The assertion says so in its own failure message.
      # (This comment deliberately does not spell the invocation literally -- the scan
      # matches on that string, and a revision of this very comment that quoted it added
      # itself to the count. C154's self-match trap, twice on one step.)
      # The count below was re-derived the same way and from a local run.
      - name: Terminal disposition register
        run: |
          set -o pipefail
          python -m unittest tests.test_terminal_disposition_register -v 2>&1 \
            | tee /tmp/c155register.log
          if ! grep -qE 'Ran 42 tests' /tmp/c155register.log; then
            echo "::error::expected 42 register pins; the suite shrank or grew"
            exit 1
          fi
          # A clean OK with no skips. TheDerivationsReadSomethingTests is the only reason
          # the zeroes in Appendix A mean anything -- every one of them is a loop over a
          # corpus or a scan of one file, and a scan that read nothing reports zero and
          # looks like a clean result. Skipping it turns four absences vacuous at once.
          if ! grep -qE '^OK$' /tmp/c155register.log; then
            echo "::error::terminal-disposition register pins did not report a clean OK"
            exit 1
          fi

      # C150. The ledger's G8 cell cites this census by number, and a cited number that
      # nothing re-derives is exactly how the 124,188-fixture figures it replaced became
      # unauditable. Re-run the census and require the committed artifact to match it
      # byte-for-byte. The script also exits non-zero on `real_trades != 0`, on a broken
      # closure identity, and on any of the three crate fixtures disagreeing with the
      # transcription -- so a transcription that drifts away from the engine is red here
      # rather than silently wrong in the ledger.
      - name: G8 band-split trade census reproduces its artifact
        run: |
          set -o pipefail
          python scripts/c150_band_split_trade_census.py --json /tmp/c150_census.json \
            > /dev/null
          if ! diff -u reports/artifacts/c150_band_split_trade_census.json \
                      /tmp/c150_census.json; then
            echo "::error::the committed G8 trade census does not match a fresh run"
            exit 1
          fi

      # The transport attestation, which nothing ran before this. Its
      # member-coverage test fails automatically whenever a PokemonSpec field is
      # added without extending the spec-vs-native comparison -- which is exactly
      # what #1113 did at 7abf3343, invisibly, because no workflow executed it.
      - name: Engine stat attestation
        run: |
          set -o pipefail
          python -m unittest tests.test_engine_stat_attestation -v 2>&1 \
            | tee /tmp/attest.log
          # The module has TWO skipTest sites, and only one of them can fire here:
          # test_real_replay_materializes_and_attests_transport_with_source_hash
          # needs a built Showdown checkout (dist/sim/index.js), which CI has not
          # got. The other (test_real_adapter_positive_and_negative_controls, on
          # "poke-engine is not installed/ready") cannot fire only because this step
          # runs AFTER the build -- move it above and you get two skips and a red
          # gate: right outcome, misleading message.
          #
          # So a bare '^OK$' is a FALSE gate -- it red-flagged this step on the first
          # attempt, because the author's machine HAS a Showdown checkout and saw
          # 16/16 clean. A module-wide no-skip assertion would be the same trap the
          # A5 step above documents. Allow the one reachable skip BY NAME and nothing
          # else, which is stricter than tolerating any skip.
          if ! grep -qE '^OK( \(skipped=1\))?$' /tmp/attest.log; then
            echo "::error::the transport attestation suite did not end OK"
            exit 1
          fi
          skips=$(grep -cE '\.\.\. skipped' /tmp/attest.log || true)
          if [ "${skips:-0}" -gt 1 ]; then
            echo "::error::more than one attestation test skipped (${skips})"
            exit 1
          fi
          if [ "${skips:-0}" -eq 1 ] && ! grep -qE \
              '^test_real_replay_materializes_and_attests_transport_with_source_hash \(.*\) \.\.\. skipped' \
              /tmp/attest.log; then
            echo "::error::an UNEXPECTED attestation test skipped"
            exit 1
          fi
          if ! grep -qE 'Ran 16 tests' /tmp/attest.log; then
            echo "::error::expected 16 attestation tests; the suite shrank or grew"
            exit 1
          fi
          # The guard this step exists for. It fails automatically whenever a
          # PokemonSpec field is added without extending the attestation, so it must
          # actually RUN, not merely be present in a skipped module.
          grep -qE '^test_member_coverage_is_locked_to_the_pokemon_spec_surface \(.*\)( |$)' \
            /tmp/attest.log || {
            echo "::error::the PokemonSpec coverage guard did not run"
            exit 1
          }

      # Row 2 step 4. Two SILENT failure modes, neither visible without a test:
      # folding the refund into rest_turns while also banking it double-counts and
      # the engine clamps the result (mon sleeps too long, nothing errors), and a
      # binding that drops the field builds a state with the refund simply gone.
      # The dropping-binding negative control is what makes the probe more than
      # decoration -- the same shape that let #1105's wheel break reach CI.
      - name: Rest refund write-side pins
        run: |
          set -o pipefail
          python -m unittest tests.test_rest_sleep_refund_write_side -v 2>&1 \
            | tee /tmp/writeside.log
          if ! grep -qE 'Ran 6 tests' /tmp/writeside.log; then
            echo "::error::expected 6 write-side pins; the suite shrank or grew"
            exit 1
          fi
          # Anchored on the word boundary, not a bare grep for 'skipped': this
          # domain is full of 'skippedTime' and a docstring first line would red
          # the gate for nothing.
          if grep -qE '(^|[^a-zA-Z])skipped=' /tmp/writeside.log; then
            echo "::error::a write-side pin SKIPPED"
            exit 1
          fi
          # expectedFailure reads as OK to every check above. Review disarmed the
          # negative control with @unittest.expectedFailure and all four
          # assertions still passed -- count, no-skip, and a bare name grep.
          if grep -qE 'expected failures|unexpected successes' /tmp/writeside.log; then
            echo "::error::a write-side pin is marked expectedFailure"
            exit 1
          fi
          # `unittest -v` prints the DOCSTRING line, not the test-name line, before
          # '... ok' -- so a per-pin '... ok' match (the gen3 step's shape) silently
          # matches nothing here for any test that has a docstring. Instead: require
          # the run to end OK, which means all five passed, and require each name to
          # be present, which means these five are the five that ran.
          if ! grep -qE '^OK$' /tmp/writeside.log; then
            echo "::error::the write-side suite did not end OK"
            exit 1
          fi
          for pin in \
            test_a_legal_split_survives_into_the_engine_pokemon \
            test_an_unrepresentable_sum_fails_closed_rather_than_clamping \
            test_the_boundary_sum_is_allowed \
            test_the_installed_binding_round_trips_the_field \
            test_a_binding_that_drops_the_field_is_rejected \
            test_an_illegal_counter_alone_is_refused_even_with_no_refund; do
            grep -qE "^$pin \(" /tmp/writeside.log || {
              echo "::error::write-side pin did not run: $pin"
              exit 1
            }
          done

      # test_search_depth_tactics is deliberately NOT here. It is skipUnless a built
      # Showdown checkout (dist/sim/index.js) is present, which CI does not have, so it
      # skipped in its entirety and the step's only real assertion was the static
      # patch-text one. Including a suite that cannot run is how a gate reads green
      # while asserting nothing -- the defect this workflow's header forbids. Add it
      # back only alongside a Showdown checkout and build.
      - name: Search-side regression gates
        run: |
          set -o pipefail
          python -m unittest tests.test_crit_kill_split_patch -v 2>&1 | tee /tmp/searchgates.log
          # A count assertion as well as a skip assertion. grep-for-'skipped'
          # cannot notice a DELETED test: removing three of four leaves the step
          # green, which is the "reads PASS while asserting less than intended"
          # shape this workflow's header forbids. Found by review of #1081.
          if ! grep -qE 'Ran 8 tests' /tmp/searchgates.log; then
            echo "::error::expected 8 tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/searchgates.log; then
            echo "::error::a search-side gate SKIPPED"
            exit 1
          fi

      # The crate is already built above, so this costs about a minute -- and it is
      # what makes the renderer pins real. CI passed on #1081 while never running the
      # four pins that cleared its BLOCK, because no workflow runs cargo test. A pin
      # nothing executes is the #1080 lesson repeated one layer down.
      # The classifier's own pin. Without this step the drag-limit reordering ships a
      # pin nothing executes -- the exact shape the crate step's comment condemns, one
      # layer down. Found by review of #1086.
      - name: Classifier pins
        run: |
          set -o pipefail
          python -m unittest tests.test_drag_limit_is_a_last_resort -v 2>&1 | tee /tmp/dragpin.log
          if ! grep -qE 'Ran 3 tests' /tmp/dragpin.log; then
            echo "::error::expected 3 tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/dragpin.log; then
            echo "::error::a classifier pin SKIPPED"
            exit 1
          fi

      # C145: the Encore-on-a-transformed-active pins. These shipped with #1148 and
      # NO workflow ran them -- `grep -rn encore .github/workflows/` returned nothing
      # across all three files, so the pin that closed `19100170/71-72` was inert. The
      # same shape the two steps above condemn, one PR later. `src/pokezero/**` is
      # already in this workflow's path filter, so a change to `engine_world.py`
      # triggers the job; it just never ran this file.
      # Includes LockIndexToResidualBlockTests, which renders the CONSTRUCTED world
      # and is the only assertion tying the lock index to Showdown's
      # `|-heal|...|[from] item: Leftovers` line. It imports pokezero_search
      # UNGUARDED for that reason -- a skip here retires the pin silently.
      # Red/green measured in reports/c145_itemleftovers_row_adjudication.md §5.3.
      # 22 -> 30 with CopiedMovesetLivePpTests, which pins that the copied moveset
      # carries the request's LIVE pp/disabled rather than the transform seed. Its
      # `test_a_drained_copy_leaves_the_engine_no_move` also imports the crate
      # unguarded, for the same reason: it asserts at the engine that a drained copy
      # produces `MoveChoice::None`, which is the token `_map_choices` resolves onto
      # the request's substituted `struggle`.
      - name: Encore-on-transform world-construction pins
        run: |
          set -o pipefail
          python -m unittest tests.test_engine_world_encore_transform -v 2>&1 \
            | tee /tmp/encoretransform.log
          if ! grep -qE 'Ran 30 tests' /tmp/encoretransform.log; then
            echo "::error::expected 30 tests; the suite shrank or grew"
            exit 1
          fi
          if grep -q 'skipped' /tmp/encoretransform.log; then
            echo "::error::an Encore-on-transform pin SKIPPED; they must never skip"
            exit 1
          fi

      # Q2 (`encore_move_unknown`, opponent seat): the sibling of the step above, on the
      # NON-transformed Encore branch. The transformed branch has consulted
      # `sides[slot]["lastUsedMove"]` since C145; the non-transformed one did not, so an
      # Encored mon that had been immobilised past the 24-line `recent_public_events`
      # window refused every world. 95/1682 gen3 randbat variants, 91.30% of the
      # world-failure census in the 2026-08-09 capture run.
      #
      # WHY THIS STEP EXISTS AT ALL, and it is the same hole the note above records: this
      # workflow names modules one by one and nothing in CI discovers `tests/`. Without a
      # step the whole battery would be run by NO job -- a fix whose tests CI never
      # executes. The count guard lives in YAML for the reason the rest of this file
      # gives: no local `unittest` or `pytest` run can see it, so a battery that shrinks
      # is red here rather than quietly green.
      #
      # READ THIS BEFORE TRUSTING A GREEN. 16 of the 21 tests execute here; 5 SKIP.
      # The 16 need no engine and no Showdown checkout -- `battle_spec_from_payload` is
      # pure construction over a payload literal -- and those are the behavioural pins.
      # The 5 that skip are `PoolCannotReachTheLockedMoveDivergenceTests`, which scans
      # the real gen3 set pool and `data/moves.ts` to bound at ZERO the one shape where
      # the `lastUsedMove` latch and the Encore event scan disagree (a `[from] lockedmove`
      # continuation, which advances Showdown's `lastMove` but not the latch). CI builds
      # no Showdown, so they cannot run here -- the same honest gap the spread-gate step
      # above documents. What DOES run in their place is
      # `TheReachabilityClaimIsTiedToAMeasuredPoolTests`, a staleness alarm holding the
      # committed pool census to the shape that scan was measured against, so a
      # regenerated pool reddens here rather than leaving the zero silently stale.
      #
      # The skip count is pinned EXACTLY, not forbidden: `skipped=5` and no more. A sixth
      # skip means a behavioural pin quietly acquired a Showdown dependency, which is how
      # a battery goes vacuous while still reporting OK. Per-METHOD skip decorators keep
      # the reported count at 21 in both environments; a class-level skip would collapse
      # to one entry and drop the count to 16, defeating the count guard.
      - name: Encore public-lastUsedMove world-construction pins
        run: |
          set -o pipefail
          python -m unittest tests.test_engine_world_encore_last_used -v 2>&1 \
            | tee /tmp/encorelastused.log
          if ! grep -qE 'Ran 21 tests' /tmp/encorelastused.log; then
            echo "::error::expected 21 tests; the suite shrank or grew"
            exit 1
          fi
          if ! grep -qE 'OK \(skipped=5\)' /tmp/encorelastused.log; then
            echo "::error::expected EXACTLY 5 skips (the pool scan, which needs a Showdown checkout CI does not build). More means a behavioural pin gained a Showdown dependency; fewer means the pool scan was deleted"
            exit 1
          fi

      # C153: the Taunt volatile. `taunt` was tracked-but-unsupported, so a Taunt
      # boundary refused with `volatile_unsupported` and no world was ever built.
      # Half of what this file pins is engine fidelity -- that the vendored gen3
      # wheel filters Status moves out of a TAUNTed side's options, and that the
      # seeded counter of 1 expires the volatile after exactly ONE end-of-turn
      # rather than two. Neither can be checked without a built engine, so the
      # module imports `poke_engine` UNGUARDED and a skip here is an error, not a
      # pass.
      #
      # The exact count is NOT a behavioural guard -- review is right that it restates
      # the membership assertion M1 already kills. It is a DELETION guard, which is the
      # reason the two steps above give and the one thing no local `unittest` run can
      # see: it lives in YAML, so a PR that removes the fidelity half of this file trips
      # here rather than reading as green.
      - name: Taunt volatile world-construction and fidelity pins
        run: |
          set -o pipefail
          python -m unittest tests.test_engine_world_taunt -v 2>&1 \
            | tee /tmp/taunt.log
          if ! grep -qE 'Ran 13 tests' /tmp/taunt.log; then
            echo "::error::expected 13 tests; the suite shrank or grew"
            exit 1
          fi
          # Anchored, not a substring match over the whole verbose log: the bare
          # `grep -q skipped` this replaced would fire on any test NAME or docstring
          # containing the word, and would equally miss nothing -- it was a guard whose
          # true and false cases were both unreliable.
          if grep -qE '\bskipped=[1-9]|\.\.\. skipped' /tmp/taunt.log; then
            echo "::error::a Taunt pin SKIPPED; they must never skip"
            exit 1
          fi

      # The `-transform` ident seam. A gen3 randbats forme is NICKNAMED after its base
      # species (`data/random-battles/gen3/teams.ts:619`), and `-transform` carries idents,
      # so a `Deoxys-Defense` announced itself as `Deoxys`; `belief.py` recorded that off
      # the ident while reading the ACTOR's species from the tracked belief, and
      # `engine_world._apply_transform` then refused every world. 24 truth-rejected
      # decisions on census control block runE-ctrl512-s4-r1000.
      #
      # WHY THIS STEP EXISTS: this workflow names modules one by one and nothing in CI
      # discovers `tests/`, so a NEW module is invisible by default -- the fix would ship
      # with a battery that no job runs. Same hole the two steps above each document.
      #
      # READ BEFORE TRUSTING A GREEN. 33 of the 37 execute here; 4 SKIP, and the skip count
      # is pinned EXACTLY rather than forbidden. The 3 are the producer-side reads --
      # `teams.ts`, `sim/pokemon.ts` and the gen3 randbat pool reachability census (13
      # forme carriers, 7 Transform carriers out of 1682) and the forme NAMING LAW the
      # belief-side bound relies on (1516/1516 entries) -- and CI builds no Showdown
      # checkout, the same honest gap the spread-gate and Encore steps record. A FIFTH
      # skip means a behavioural pin quietly acquired a Showdown dependency, which is how a
      # battery goes vacuous while still printing OK. Per-METHOD decorators keep the
      # reported total at 37 in both environments; a class-level skip would collapse to one
      # entry and drop the total to 33, defeating the count guard.
      - name: Transform forme-ident belief and world-construction pins
        run: |
          set -o pipefail
          python -m unittest tests.test_transform_forme_ident -v 2>&1 \
            | tee /tmp/transformforme.log
          if ! grep -qE 'Ran 37 tests' /tmp/transformforme.log; then
            echo "::error::expected 37 tests; the suite shrank or grew"
            exit 1
          fi
          if ! grep -qE '\bskipped=4\b' /tmp/transformforme.log; then
            echo "::error::expected exactly 4 skips (the Showdown-checkout reads)"
            exit 1
          fi

      # The engine-search telemetry seam, which NO workflow ran before this. Checked with
      # `grep -rn test_engine_search .github/workflows/` on main: zero hits across all
      # three files, while `src/pokezero/**` has been in this job's path filter all along
      # -- so every PR that edited `engine_search.py` triggered the gate and the module
      # holding that file's pins was not a step. The same "guard nothing runs" shape the
      # three steps above each document one PR after the other.
      #
      # It holds the abort-path pins added with the sub-case carry: that an ABORTED world
      # still reports what it observed (which this seam silently discarded), that it is not
      # double-counted, that a payload of the wrong shape is a no-op rather than a crash
      # inside the handler whose job is to keep the other worlds alive, and the two
      # CROSS-LANGUAGE pins. Those last two
      # matter most here: the Rust unit tests read the attribute name through the crate's
      # own constant, so they are insensitive to a rename by construction, and the Python
      # pin is the ONLY thing that fails when the two sides drift. RE-MEASURED on the
      # merged tree: changing `ABORT_PAYLOAD_ATTR`'s value in Rust alone leaves all 451
      # crate tests green (0 failed), and reddens exactly one thing anywhere --
      # `test_the_crate_and_python_agree_on_the_abort_payload_attribute` in the step
      # below, 112 of 113. An earlier revision of this comment said 429, a total this
      # branch never had at any point; the figure is the one the run printed.
      #
      # 113 -> 128 with the world-collapse change. The delta is 15 TESTS THAT ALREADY
      # EXISTED and never ran: 13 collapse/cache-key tests sat below this module's
      # `unittest.main()`, where `python -m unittest` cannot see them, plus 2 added by its
      # review. This exact-count pin read 113 straight through that PR precisely BECAUSE
      # the tests were invisible -- the count guard cannot see a test that does not run,
      # so "the total held" was not evidence the suite was intact. The 112-of-113 mutation
      # ratio above was measured on the pre-collapse tree and has NOT been re-run here;
      # only the total is re-measured (`Ran 128 tests`, OK, on the merged tree).
      #
      # 128 -> 135 with the Tier-2 pruned-conclusion fix: the seven
      # `Tier2PrunedConclusionTests`. All seven are NEW and all seven RUN (they sit above
      # this module's `unittest.main()`); counted from the run, not from the diff.
      #
      # 135 -> 141 with that fix's review follow-up: six more
      # `Tier2PrunedConclusionTests`, all NEW and all above `unittest.main()`. Two pin
      # properties whose MUTANTS SURVIVED the 135 (the record is per-seat, not per-battle;
      # the record holds what the fold APPLIED, not what the source OFFERED); two pin both
      # sides of the applied-record invariant's new guard; two close axes that survived a
      # LATER count. THREE of the six exist because a mutant survived a suite that had
      # already been called complete -- the safer-direction one survived 138, and the
      # record-CARDINALITY pair survived 139, every other test in the class having offered
      # exactly one index. Counted from the run (`Ran 141 tests`, OK), not from the diff.
      #
      # EXACT count, not a floor, for the reason #1163 gave: a floor was the one fail-open
      # in its mutation battery, and this guard lives in YAML where no local `unittest`
      # run can see it.
      - name: Engine-search telemetry pins
        run: |
          set -o pipefail
          python -m unittest tests.test_engine_search -v 2>&1 | tee /tmp/enginesearch.log
          if ! grep -qE 'Ran 141 tests' /tmp/enginesearch.log; then
            echo "::error::expected 141 engine-search tests; the suite shrank or grew"
            exit 1
          fi
          if ! grep -qE '^OK$' /tmp/enginesearch.log; then
            echo "::error::the engine-search suite did not report a clean OK"
            exit 1
          fi
          # Name the abort-path pins. A total is restorable by unrelated tests, and these
          # SEVEN are the only guards that an aborted world reports anything at all.
          # Counted, not recalled: an earlier revision of this comment said "five" while
          # listing six, which is the same off-by-one the crate block below records
          # having made twice.
          #
          # Matched as "declared and RAN", not "... ok". These tests have docstrings, so
          # unittest -v prints the verdict on the FOLLOWING line, and the policy's own
          # fallback logging interleaves into it -- a `\.\.\. ok` pattern silently matches
          # nothing and the loop becomes decoration. Verified locally against the real log.
          # Ran + exact count + a clean `^OK$` above is what establishes they PASSED; this
          # loop establishes they EXIST. Same construction as the attestation step.
          for pin in test_an_aborted_world_still_reports_the_subcases_it_observed \
                     test_an_aborted_world_reports_each_observation_exactly_once \
                     test_a_failure_carrying_no_payload_is_a_silent_no_op \
                     test_the_crate_and_python_agree_on_the_abort_payload_attribute \
                     test_the_subcase_key_is_present_in_the_report_even_when_empty \
                     test_countable_entries_survive_alongside_uncountable_ones \
                     test_the_failure_reason_is_recorded_before_the_diagnostics_are_absorbed; do
            grep -qE "^$pin \(.*\)( |\$)" /tmp/enginesearch.log || {
              echo "::error::engine-search abort pin $pin did not run"
              exit 1
            }
          done

      - name: Crate suites, including the renderer pins
        run: |
          set -o pipefail
          # RUSTFLAGS is load-bearing. tree.rs:139 gates
          # debug_assert_probability_conservation on cfg!(debug_assertions), and
          # [profile.release] sets only lto/codegen-units -- so plain
          # `cargo test --release` compiles OUT the crate's own probability-mass
          # invariant plus six debug_assert!s in tree.rs. A mass-gate workflow running
          # the crate in the one profile where its mass assertion does not exist is the
          # defect this job is named after. Found by review of #1083.
          # --no-fail-fast IS LOAD-BEARING, and its absence was measured rather than
          # suspected. cargo stops after the first failing TARGET, so with one failing lib
