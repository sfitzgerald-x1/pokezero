name: Controlled benchmark cost contracts

on:
  pull_request:
    paths:
      - 'src/pokezero/controlled_benchmark_cost.py'
      - 'tests/test_controlled_benchmark_cost.py'
      - 'tests/_controlled_benchmark_cost_fixture.py'
      - '.github/workflows/controlled-benchmark-cost.yml'
  push:
    branches: [main]
    paths:
      - 'src/pokezero/controlled_benchmark_cost.py'
      - 'tests/test_controlled_benchmark_cost.py'
      - 'tests/_controlled_benchmark_cost_fixture.py'
      - '.github/workflows/controlled-benchmark-cost.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install bridge protocol dependency only
        run: python -m pip install 'websockets>=15.0.1,<16'
      - name: Exercise owned real processes with authored benchmark surfaces
        env:
          PYTHONPATH: src:tests
        run: python -m unittest test_controlled_benchmark_cost -v
