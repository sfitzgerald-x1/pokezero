name: Fleet worker

on:
  pull_request:
    paths:
      - ".github/workflows/fleet-worker.yml"
      - "pyproject.toml"
      - "src/pokezero/fleet_worker.py"
      - "src/pokezero/rollout_cli.py"
      - "src/pokezero/collection.py"
      - "src/pokezero/selfplay.py"
      - "src/pokezero/dataset.py"
      - "tests/test_fleet_worker.py"
      - "tests/test_cache_concat.py"
      - "tests/test_rollout.py"

jobs:
  fanin-crash-matrix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install base worker plus NumPy cache dependency
        run: python -m pip install -e . numpy

      - name: Assert NumPy-backed cache dependency
        run: python -c "import numpy; print(numpy.__version__)"

      - name: Assert worker workflow stays Torch-free
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"

      - name: Run fan-in crash matrix
        run: python -m unittest tests.test_fleet_worker tests.test_cache_concat tests.test_rollout tests.test_public_invariant
