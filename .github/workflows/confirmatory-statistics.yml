name: Confirmatory statistical contracts

on:
  pull_request:
    paths:
      - 'src/pokezero/mcts_eval/search_over_raw_statistics.py'
      - 'scripts/calibrate_search_over_raw_joint.py'
      - 'tests/test_search_over_raw_statistics.py'
      - 'src/pokezero/mcts_eval/search_over_raw_t_candidate.py'
      - 'scripts/calibrate_search_over_raw_t_candidate.py'
      - 'tests/test_search_over_raw_t_candidate.py'
      - '.github/workflows/confirmatory-statistics.yml'
  push:
    branches: [main]
    paths:
      - 'src/pokezero/mcts_eval/search_over_raw_statistics.py'
      - 'scripts/calibrate_search_over_raw_joint.py'
      - 'tests/test_search_over_raw_statistics.py'
      - 'src/pokezero/mcts_eval/search_over_raw_t_candidate.py'
      - 'scripts/calibrate_search_over_raw_t_candidate.py'
      - 'tests/test_search_over_raw_t_candidate.py'
      - '.github/workflows/confirmatory-statistics.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install numerical test dependency only
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify exact-cell joins and bounded joint inference
        env:
          PYTHONPATH: src:tests:scripts
        run: python -m unittest test_search_over_raw_statistics test_search_over_raw_t_candidate -v
