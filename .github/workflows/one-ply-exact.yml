name: One ply exact chance LP contracts
on:
  pull_request:
    paths:
      - 'src/pokezero/one_ply_exact.py'
      - 'src/pokezero/shallow_exact.py'
      - 'src/pokezero/shallow_exact_native.py'
      - 'tests/test_shallow_exact_native.py'
      - 'tests/test_one_ply_exact.py'
      - 'scripts/bench_one_ply_exact_native.py'
      - 'scripts/bench_shallow_exact_native.py'
      - 'tests/test_one_ply_native_runner.py'
      - 'tests/test_shallow_exact_native_runner.py'
      - 'tests/test_shallow_exact.py'
      - 'tests/test_shallow_exact_streaming.py'
      - '.github/workflows/one-ply-exact.yml'
  push:
    branches: [main]
    paths:
      - 'src/pokezero/one_ply_exact.py'
      - 'src/pokezero/shallow_exact.py'
      - 'src/pokezero/shallow_exact_native.py'
      - 'tests/test_shallow_exact_native.py'
      - 'tests/test_one_ply_exact.py'
      - 'scripts/bench_one_ply_exact_native.py'
      - 'scripts/bench_shallow_exact_native.py'
      - 'tests/test_one_ply_native_runner.py'
      - 'tests/test_shallow_exact_native_runner.py'
      - 'tests/test_shallow_exact.py'
      - 'tests/test_shallow_exact_streaming.py'
      - '.github/workflows/one-ply-exact.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install numerical contracts
        run: python -m pip install -e '.[analysis]'
      - name: Check one ply LP and preserve historical depth two behavior
        env:
          PYTHONPATH: src:scripts:tests
        run: python -m unittest test_one_ply_exact test_one_ply_native_runner test_shallow_exact test_shallow_exact_streaming test_shallow_exact_native test_shallow_exact_native_runner -v
