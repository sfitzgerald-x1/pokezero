<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">PokeZero V4 observation token input</title>
  <desc id="desc">A PokeZero decision is represented by 23 token rows: one field token, six self Pokemon, six opponent Pokemon, nine legal actions, and one tendency token. There is no history region. Every row has 132 numeric and 41 categorical columns.</desc>

  <rect width="1120" height="600" rx="16" fill="#0b1117"/>
  <rect x="1" y="1" width="1118" height="598" rx="15" fill="none" stroke="#25303b"/>

  <text x="40" y="43" fill="#edf3f8" font-size="23" font-weight="700">V4 observation input</text>
  <text x="40" y="69" fill="#9aa8b5" font-size="13">One decision is a fixed 23-row entity sequence — no history region. Each row uses the same 132 numeric + 41 categorical layout.</text>

  <g font-size="11" font-weight="600">
    <rect x="817" y="26" width="82" height="30" rx="15" fill="#18232e" stroke="#31404d"/>
    <text x="858" y="45" text-anchor="middle" fill="#f0c66a">23 rows</text>
    <rect x="908" y="26" width="82" height="30" rx="15" fill="#18232e" stroke="#31404d"/>
    <text x="949" y="45" text-anchor="middle" fill="#7dd3bc">132 num</text>
    <rect x="999" y="26" width="81" height="30" rx="15" fill="#18232e" stroke="#31404d"/>
    <text x="1039.5" y="45" text-anchor="middle" fill="#9fc5ff">41 cat</text>
  </g>

  <text x="40" y="108" fill="#dce5ed" font-size="14" font-weight="600">Token rows (23 total, drawn to scale — a v4 forward is ~3.8&#215; shorter than v3's 87 rows)</text>

  <rect x="40" y="122" width="45.2" height="42" fill="#c6943d"/>
  <rect x="85.2" y="122" width="271.3" height="42" fill="#23725e"/>
  <rect x="356.5" y="122" width="271.3" height="42" fill="#8d3654"/>
  <rect x="627.8" y="122" width="406.9" height="42" fill="#315f93"/>
  <rect x="1034.7" y="122" width="45.3" height="42" fill="#a65e43"/>
  <g stroke="rgba(255,255,255,.12)" stroke-width="1">
    <line x1="130.4" y1="122" x2="130.4" y2="164"/><line x1="175.6" y1="122" x2="175.6" y2="164"/>
    <line x1="220.8" y1="122" x2="220.8" y2="164"/><line x1="266.1" y1="122" x2="266.1" y2="164"/>
    <line x1="311.3" y1="122" x2="311.3" y2="164"/>
    <line x1="401.7" y1="122" x2="401.7" y2="164"/><line x1="446.9" y1="122" x2="446.9" y2="164"/>
    <line x1="492.1" y1="122" x2="492.1" y2="164"/><line x1="537.4" y1="122" x2="537.4" y2="164"/>
    <line x1="582.6" y1="122" x2="582.6" y2="164"/>
    <line x1="673.0" y1="122" x2="673.0" y2="164"/><line x1="718.2" y1="122" x2="718.2" y2="164"/>
    <line x1="763.4" y1="122" x2="763.4" y2="164"/><line x1="808.7" y1="122" x2="808.7" y2="164"/>
    <line x1="853.9" y1="122" x2="853.9" y2="164"/><line x1="899.1" y1="122" x2="899.1" y2="164"/>
    <line x1="944.3" y1="122" x2="944.3" y2="164"/><line x1="989.5" y1="122" x2="989.5" y2="164"/>
  </g>
  <text x="220.8" y="147" fill="#d7f2e9" font-size="11" font-weight="600" text-anchor="middle">self x6</text>
  <text x="492.1" y="147" fill="#fad5df" font-size="11" font-weight="600" text-anchor="middle">opp x6</text>
  <text x="831.2" y="141" fill="#d8e7ff" font-size="11" font-weight="600" text-anchor="middle">actions x9</text>
  <text x="831.2" y="156" fill="#9fb6d4" font-size="9.5" text-anchor="middle">4 moves &#183; 5 switches</text>

  <g fill="#768493" font-size="9">
    <text x="40" y="177">0</text>
    <text x="353" y="177">7</text>
    <text x="624" y="177">13</text>
    <text x="1062" y="177">22</text>
  </g>
  <line x1="62" y1="122" x2="62" y2="99" stroke="#c6943d"/>
  <text x="62" y="94" fill="#f0c66a" font-size="9.5" font-weight="600" text-anchor="middle">field</text>
  <line x1="1057" y1="164" x2="1057" y2="185" stroke="#a65e43"/>
  <text x="1052" y="197" fill="#eba78e" font-size="9.5" font-weight="600" text-anchor="middle">tendency</text>

  <text x="40" y="224" fill="#dce5ed" font-size="14" font-weight="600">Where the history region went</text>
  <g font-size="11.5">
    <g transform="translate(40 239)">
      <rect width="510" height="67" rx="9" fill="#151d25" stroke="#293541"/>
      <text x="18" y="26" fill="#edf3f8" font-weight="600">Named as current state (the feature pack)</text>
      <text x="18" y="48" fill="#9aa8b5">forced recharge, last executed move, Truant phase, Traced ability,</text>
      <text x="18" y="62" fill="#9aa8b5">last-round damage, hazard credit/payoff, switch-vs-active tendencies</text>
    </g>
    <g transform="translate(570 239)">
      <rect width="510" height="67" rx="9" fill="#151d25" stroke="#293541"/>
      <text x="18" y="26" fill="#edf3f8" font-weight="600">Moved into the belief candidate sets</text>
      <text x="18" y="48" fill="#9aa8b5">the pinned Choice-item and investment conclusions now narrow the</text>
      <text x="18" y="62" fill="#9aa8b5">opponent's candidate sets instead of projecting onto lossy scalars</text>
    </g>
  </g>

  <text x="40" y="352" fill="#dce5ed" font-size="14" font-weight="600">Every token row: fixed-width feature columns</text>
  <text x="1080" y="352" fill="#788694" font-size="10" text-anchor="end">numeric groups shown to scale</text>

  <g>
    <rect x="40" y="367" width="47.3" height="39" fill="#3e5d78"/>
    <rect x="87.3" y="367" width="299.4" height="39" fill="#23725e"/>
    <rect x="386.7" y="367" width="417.6" height="39" fill="#70405a"/>
    <rect x="804.3" y="367" width="47.3" height="39" fill="#315f93"/>
    <rect x="851.6" y="367" width="141.8" height="39" fill="#9b7434"/>
    <rect x="993.4" y="367" width="86.6" height="39" fill="#98563e"/>
    <g fill="#f2f5f8" font-size="9.5" font-weight="600" text-anchor="middle">
      <text x="63.7" y="390">Core 6</text>
      <text x="237" y="385">Pokemon 38</text>
      <text x="237" y="398" font-weight="400" fill="#cfeadf">incl. pack A</text>
      <text x="595.5" y="390">Belief 53</text>
      <text x="827.9" y="390">Act. 6</text>
      <text x="922.5" y="385">Field 18</text>
      <text x="922.5" y="398" font-weight="400" fill="#f0ddb8">incl. hazard pack</text>
      <text x="1036.7" y="390">Tendency 11</text>
    </g>
  </g>
  <g fill="#91a0ae" font-size="9.5">
    <text x="40" y="421">no history group — the 34 per-turn columns left with the region</text>
    <text x="1080" y="421" text-anchor="end">132 numeric columns total</text>
  </g>

  <rect x="40" y="441" width="1040" height="37" rx="7" fill="#18283a" stroke="#29415a"/>
  <rect x="40" y="441" width="235" height="37" rx="7" fill="#264f78"/>
  <text x="57" y="464" fill="#e4eef9" font-size="11" font-weight="600">41 categorical ids</text>
  <text x="294" y="464" fill="#9fb1c2" font-size="11">token identity, species, moves, types, status, belief atoms, volatiles, last used move, Traced ability</text>

  <rect x="40" y="494" width="1040" height="37" rx="7" fill="#1c2a20" stroke="#2c4434"/>
  <text x="57" y="517" fill="#bfe9cd" font-size="11" font-weight="600">899 embedding rows</text>
  <text x="294" y="517" fill="#9db4a6" font-size="11">closed vocabulary, no feature hashing — the turn-history vocabulary families left with the region</text>

  <text x="40" y="574" fill="#7f8d9a" font-size="10.5">Rows are intentionally sparse by token type. A token-type id and attention mask tell the transformer which entity each row represents.</text>
</svg>
