<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">PokeZero V2 and V2.1 observation token input</title>
  <desc id="desc">A v2 decision is a single 151-token sequence: one field token, six self Pokemon, six opponent Pokemon, nine legal actions, one opponent-tendency token, and a 128-slot transition block holding one token per declared action. V2.1 added defender identity, PP-validity bits, and substitute HP as checkpoint-driven columns.</desc>

  <rect width="1120" height="430" rx="16" fill="#0b1117"/>
  <rect x="1" y="1" width="1118" height="428" rx="15" fill="none" stroke="#25303b"/>

  <text x="40" y="43" fill="#edf3f8" font-size="23" font-weight="700">V2 / V2.1 observation input</text>
  <text x="40" y="69" fill="#9aa8b5" font-size="13">One decision = one snapshot plus an ordered transition block: window-size 1, and memory becomes an explicit, structured region.</text>

  <g font-size="11" font-weight="600">
    <rect x="908" y="26" width="82" height="30" rx="15" fill="#18232e" stroke="#31404d"/>
    <text x="949" y="45" text-anchor="middle" fill="#f0c66a">151 rows</text>
    <rect x="999" y="26" width="81" height="30" rx="15" fill="#18232e" stroke="#31404d"/>
    <text x="1039.5" y="45" text-anchor="middle" fill="#9fc5ff">window 1</text>
  </g>

  <text x="40" y="108" fill="#dce5ed" font-size="14" font-weight="600">Token rows (151 total, drawn to scale)</text>

  <!-- 1040px / 151 tokens = 6.887/token -->
  <rect x="40" y="122" width="6.9" height="42" fill="#c6943d"/>
  <rect x="46.9" y="122" width="41.3" height="42" fill="#23725e"/>
  <rect x="88.2" y="122" width="41.3" height="42" fill="#8d3654"/>
  <rect x="129.5" y="122" width="62" height="42" fill="#315f93"/>
  <rect x="191.5" y="122" width="6.9" height="42" fill="#a65e43"/>
  <rect x="198.4" y="122" width="881.6" height="42" fill="#3d3345"/>
  <g stroke="#4c4156" stroke-width="1">
    <line x1="253.5" y1="122" x2="253.5" y2="164"/><line x1="308.6" y1="122" x2="308.6" y2="164"/>
    <line x1="363.7" y1="122" x2="363.7" y2="164"/><line x1="418.8" y1="122" x2="418.8" y2="164"/>
    <line x1="473.9" y1="122" x2="473.9" y2="164"/><line x1="529.0" y1="122" x2="529.0" y2="164"/>
    <line x1="584.1" y1="122" x2="584.1" y2="164"/><line x1="639.2" y1="122" x2="639.2" y2="164"/>
    <line x1="694.3" y1="122" x2="694.3" y2="164"/><line x1="749.4" y1="122" x2="749.4" y2="164"/>
    <line x1="804.5" y1="122" x2="804.5" y2="164"/><line x1="859.6" y1="122" x2="859.6" y2="164"/>
    <line x1="914.7" y1="122" x2="914.7" y2="164"/><line x1="969.8" y1="122" x2="969.8" y2="164"/>
    <line x1="1024.9" y1="122" x2="1024.9" y2="164"/>
  </g>
  <text x="67.5" y="147" fill="#d7f2e9" font-size="10.5" font-weight="600" text-anchor="middle">self &#215;6</text>
  <text x="108.9" y="147" fill="#fad5df" font-size="10.5" font-weight="600" text-anchor="middle">opp &#215;6</text>
  <text x="160.5" y="141" fill="#d8e7ff" font-size="10.5" font-weight="600" text-anchor="middle">actions &#215;9</text>
  <text x="160.5" y="155" fill="#9fb6d4" font-size="9" text-anchor="middle">4 mv &#183; 5 sw</text>
  <text x="639" y="141" fill="#d9cde6" font-size="11" font-weight="600" text-anchor="middle">transition tokens &#215;128 — one per declared action</text>
  <text x="639" y="156" fill="#a293b3" font-size="9.5" text-anchor="middle">the K budget counts these slots; a double-switch turn spends several on one turn</text>

  <line x1="43.5" y1="122" x2="43.5" y2="99" stroke="#c6943d" stroke-width="1.5"/>
  <text x="43" y="94" fill="#f0c66a" font-size="10" font-weight="600">field</text>
  <line x1="195" y1="164" x2="195" y2="186" stroke="#a65e43" stroke-width="1.5"/>
  <text x="195" y="198" fill="#eba78e" font-size="10" font-weight="600" text-anchor="middle">tendency (new in v2)</text>

  <g fill="#768493" font-size="9">
    <text x="40" y="177">0</text><text x="86" y="177">7</text>
    <text x="126" y="177">13</text><text x="198" y="177">23</text><text x="1068" y="177">150</text>
  </g>

  <text x="40" y="242" fill="#dce5ed" font-size="14" font-weight="600">What changed from v1, and what v2.1 patched</text>
  <g font-size="11.5">
    <g transform="translate(40 256)">
      <rect width="333" height="82" rx="9" fill="#151d25" stroke="#293541"/>
      <text x="18" y="26" fill="#edf3f8" font-weight="600">One snapshot, not four</text>
      <text x="18" y="48" fill="#9aa8b5">The stacked frames and the 24 raw event</text>
      <text x="18" y="62" fill="#9aa8b5">tokens are gone; entity tokens carry the</text>
      <text x="18" y="76" fill="#9aa8b5">present, the transition block carries the past.</text>
    </g>
    <g transform="translate(393 256)">
      <rect width="333" height="82" rx="9" fill="#151d25" stroke="#293541"/>
      <text x="18" y="26" fill="#edf3f8" font-weight="600">Structured memory</text>
      <text x="18" y="48" fill="#9aa8b5">Each transition token is a typed record of one</text>
      <text x="18" y="62" fill="#9aa8b5">declared action: who, what, damage band,</text>
      <text x="18" y="76" fill="#9aa8b5">miss/crit/KO flags — not raw protocol lines.</text>
    </g>
    <g transform="translate(746 256)">
      <rect width="334" height="82" rx="9" fill="#151d25" stroke="#293541"/>
      <text x="18" y="26" fill="#edf3f8" font-weight="600">v2.1: encode what was already public</text>
      <text x="18" y="48" fill="#9aa8b5">Defender identity on move transitions, per-move</text>
      <text x="18" y="62" fill="#9aa8b5">PP-validity evidence, substitute HP fraction —</text>
      <text x="18" y="76" fill="#9aa8b5">checkpoint-driven, no break with v2.</text>
    </g>
  </g>

  <text x="40" y="378" fill="#dce5ed" font-size="14" font-weight="600">The limitation that led to v2.2</text>
  <text x="40" y="400" fill="#9aa8b5" font-size="12">One token per declared action spends the K budget fast: K=64 covers only ~32 turns of a long game, and busy turns burn several slots each —</text>
  <text x="40" y="416" fill="#9aa8b5" font-size="12">the horizon a checkpoint could see was set by protocol chattiness, not by how far back the game actually mattered.</text>
</svg>
